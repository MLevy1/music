<title>Musical Intervention Graph v0.6</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#20242d;--text:#eef1f5;--muted:#9aa3af;--border:#2d3340;--accent:#8fb5ff;--danger:#ff8f8f;--ok:#8fd9b6}
*{box-sizing:border-box} body{margin:0;font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit} button{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:9px 11px} button:active{transform:translateY(1px)}
#app{display:grid;grid-template-rows:auto 1fr;height:100dvh}.topbar{display:flex;gap:8px;align-items:center;padding:10px max(10px,env(safe-area-inset-right)) 10px max(10px,env(safe-area-inset-left));border-bottom:1px solid var(--border);background:var(--panel);z-index:5}.brand{font-weight:700;white-space:nowrap}.search{flex:1;min-width:80px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 10px}.topbar select{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 8px;max-width:145px}
.main{display:grid;grid-template-columns:1fr 340px;min-height:0}.canvasWrap{position:relative;min-width:0;min-height:0}.canvasWrap canvas{width:100%;height:100%;display:block;touch-action:none}.hint{position:absolute;left:10px;bottom:10px;background:#0f1115cc;border:1px solid var(--border);border-radius:9px;padding:7px 9px;color:var(--muted);font-size:12px;pointer-events:none}.panel{border-left:1px solid var(--border);background:var(--panel);padding:14px;overflow:auto}.muted{color:var(--muted)}.pill{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:3px 7px;margin:2px 3px 2px 0;font-size:12px;color:var(--muted)}.nodeTitle{font-size:22px;font-weight:700;margin:2px 0 4px}.section{margin-top:18px}.section h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}.edge{padding:9px 0;border-bottom:1px solid var(--border)}.edgeMain{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.edgeJump{min-width:0;flex:1;cursor:pointer}.edge b{display:block;font-weight:600}.edge small{color:var(--muted)}.edgeActions{display:flex;gap:5px;flex-shrink:0}.edgeActions button{padding:5px 7px;font-size:12px;border-radius:7px}.edgeSelected{background:#20242d;border-radius:8px;padding-left:7px;padding-right:7px}.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.status{font-size:12px;color:var(--muted);margin-top:8px}.form{display:grid;gap:8px}.form input,.form select,.form textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px}.form textarea{min-height:74px;resize:vertical}.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button.active{outline:2px solid var(--accent)}.danger{border-color:#6b3434}.ok{color:var(--ok)}
.nodeNotes{white-space:pre-line}.profileGrid{display:grid;gap:8px;margin-top:12px}.profileBlock{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px}.profileBlock h4{font-size:11px;line-height:1.2;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 5px}.profileBlock p{margin:0;white-space:pre-line}.inheritTags{display:flex;flex-wrap:wrap;gap:5px}.inheritTags .pill{margin:0;color:var(--text)}.works{display:grid;gap:9px}.workCard{border:1px solid var(--border);border-radius:11px;padding:10px;background:#11141a}.workHead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}.workTitle{font-weight:700}.workYear{font-size:12px;color:var(--muted);white-space:nowrap}.workLine{margin-top:5px}.workLine b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:1px}.relationClass{display:inline-block;margin-right:5px;color:var(--accent)}
#drawerBtn{display:none}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{background:var(--panel);border-radius:18px 18px 0 0;width:100%;max-height:82dvh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}.sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sheetHead h2{margin:0;font-size:18px}
@media(max-width:760px){.main{grid-template-columns:1fr}.panel{display:none}.brand{font-size:13px}.topbar select{max-width:115px}#drawerBtn{display:block}.hint{bottom:8px}.topbar{gap:6px}.topbar button{padding:9px}.search{max-width:none}}

.canvasWrap canvas{position:absolute;inset:0;z-index:2}
.noScriptNote{display:none;position:absolute;left:12px;top:12px;z-index:3;background:#171a21e8;border:1px solid var(--border);border-radius:10px;padding:8px 10px;color:var(--muted);font-size:12px;max-width:310px}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">Musical Interventions v0.6</div>
    <input id="search" class="search" placeholder="Search artists or works…" autocomplete="off" />
    <select id="typeFilter"><option value="">All types</option></select>
    <button id="resetBtn" title="Reset view">Reset</button>
    <button id="drawerBtn">Details</button>
  </div>
  <div class="main">
    <div class="canvasWrap"><canvas id="graph"></canvas><noscript><div class="noScriptNote" style="display:block">Open this file in a browser with JavaScript enabled to explore the artist-centered graph.</div></noscript><div class="hint">Tap a node • drag to move • pinch/scroll to zoom • drag background to pan</div></div>
    <aside id="panel" class="panel"></aside>
  </div>
</div>
<div id="modal" class="modal"><div class="sheet"><div class="sheetHead"><h2>Node details</h2><button id="closeModal">Close</button></div><div id="mobilePanel"></div></div></div>
<script>
const SEED = {
  schemaVersion: "0.6",
  model: "artist-centered intervention graph",
  relationshipClasses: {
    documented_influence: "A traceable influence, collaboration, study, or acknowledged source.",
    capability_inheritance: "A musical capacity made available historically; it does not require conscious or direct influence.",
    structural_analogy: "A useful formal resemblance without a claim of direct transmission.",
    institutional_context: "A period, medium, community, or production environment in which the artist worked."
  },
  nodes: [
    {
      id: "system",
      name: "Artist-Centered Musical Intervention Graph",
      type: "system",
      years: "c. 1400–today",
      notes: "Artists are the primary agents. Each artist is treated as a relatively stable decision-making system; each album or work is a temporary weighting of inherited capacities; each intervention is the new possibility produced by that weighting. Periods and media remain only as navigational context."
    },
    {id:"lineage_renaissance",name:"Renaissance polyphony & spatial rhetoric",type:"lineage",years:"c. 1400–1600",notes:"Context only: court, chapel, liturgy, manuscript and print cultures; modal counterpoint; sacred and secular song."},
    {id:"lineage_baroque",name:"Baroque tonality, instrument & drama",type:"lineage",years:"c. 1600–1750",notes:"Context only: basso continuo, emerging major-minor tonality, opera, concerto, dance and public musical drama."},
    {id:"lineage_classical",name:"Classical form & public argument",type:"lineage",years:"c. 1730–1820",notes:"Context only: galant rhetoric, sonata practice, symphony, quartet, public concert and a growing music market."},
    {id:"lineage_romantic",name:"Romantic interiority & world-building",type:"lineage",years:"c. 1810–1910",notes:"Context only: literary Romanticism, virtuoso identity, expanded orchestra, chromatic harmony, historicism and mass concert culture."},
    {id:"lineage_black_atlantic",name:"Black Atlantic performance systems",type:"lineage",years:"18th century–today",notes:"Context only: African-diasporic rhythmic, vocal, timbral and participatory practices transformed under slavery, migration, segregation, church, theater, dance, recording and commerce. This is a primary engine of modern music, not a side branch."},
    {id:"lineage_modernism",name:"Modernisms: rhythm, timbre, process & space",type:"lineage",years:"c. 1890–today",notes:"Context only: multiple modernisms that reorganize rhythm, pitch, timbre, form, noise, chance, silence, repetition, ritual and acoustic space."},
    {id:"lineage_recording",name:"Recording & studio construction",type:"lineage",years:"1877–today",notes:"Context only: microphone, disc, tape, multitrack, mixing, amplification and production make the repeatable sonic object a compositional medium."},
    {id:"lineage_film",name:"Film music & narrative sound",type:"lineage",years:"1920s–today",notes:"Context only: synchronized image, editing, leitmotif, orchestral color, electronics and sound design turn music into narrative infrastructure."},
    {id:"lineage_electronic",name:"Electronic, playback & digital process",type:"lineage",years:"1940s–today",notes:"Context only: tape, synthesis, dub, turntablism, sampling, sequencing, software and network distribution make sound and recorded history editable."},

    {id:"dufay",name:"Guillaume Dufay",type:"artist",years:"c. 1397–1474",era:"Renaissance",profile:{inherited:["chant and isorhythm","French song","English consonance","court and chapel institutions"],problem:"How can a large sacred cycle feel unified without losing melodic identity?",intervention:"Combines cyclic construction, learned counterpoint, consonant sonority and memorable borrowed melody.",capacity:"Polyphony can become coherent large-scale architecture with a recognizable melodic identity."},works:[{title:"Se la face ay pale / Missa Se la face ay pale",year:"c. 1430s / 1450s",weighting:"Secular tune + cyclic Mass + clear sonority",intervention:"A public song becomes the structural memory of an entire sacred cycle.",capacity:"A work can bind many movements through transformed recurrence."}]},
    {id:"ockeghem",name:"Johannes Ockeghem",type:"artist",years:"c. 1410–1497",era:"Renaissance",profile:{inherited:["cyclic Mass","cantus firmus technique","increasingly equal voices","Franco-Flemish chapel practice"],problem:"What if polyphony no longer behaves like a tune surrounded by decoration?",intervention:"Deepens vocal independence, registral breadth, continuous flow and concealed canonic design.",capacity:"Polyphony can act as an autonomous, self-generating environment."},works:[{title:"Missa prolationum",year:"15th century",weighting:"Canon + equal voices + continuous texture",intervention:"Mensural canons generate the music from relations among voices rather than a foreground melody.",capacity:"A compositional rule can produce an audible world."}]},
    {id:"josquin",name:"Josquin des Prez",type:"artist",years:"c. 1450–1521",era:"Renaissance",profile:{inherited:["Franco-Flemish counterpoint","canon","sacred and secular song","Italian text-centered culture"],problem:"Dense continuous polyphony can obscure words, motives and formal joints.",intervention:"Uses compact motives, paired voices, imitation and text-sensitive changes of texture.",capacity:"Polyphony can function as intelligible conversation and rhetoric."},works:[{title:"Ave Maria … virgo serena",year:"c. 1480s",weighting:"Imitation + sectional text setting + cadence",intervention:"Each textual unit receives a distinct but related contrapuntal treatment.",capacity:"A motet can make its architecture immediately hearable."}]},
    {id:"palestrina",name:"Giovanni Pierluigi da Palestrina",type:"artist",years:"c. 1525–1594",era:"Renaissance",profile:{inherited:["mature imitative counterpoint","Roman liturgy","modal vocal writing","Josquin-era rhetoric"],problem:"How can dense sacred polyphony retain clarity, balance and liturgical function?",intervention:"Regulates dissonance, smooths melodic motion and coordinates imitation with declamation.",capacity:"Complexity and clarity can coexist as a stable equilibrium."},works:[{title:"Missa Papae Marcelli",year:"c. 1560s",weighting:"Six voices + chordal declamation + controlled counterpoint",intervention:"Texture changes make important text audible without abandoning polyphonic richness.",capacity:"Institutional constraint can become a refined expressive grammar."}]},
    {id:"gabrieli",name:"Giovanni Gabrieli",type:"artist",years:"c. 1554–1612",era:"Renaissance / early Baroque",profile:{inherited:["Venetian polychoral practice","vocal counterpoint","instrumental ceremony","St. Mark's acoustics"],problem:"What happens when sound sources occupy distinct physical locations?",intervention:"Coordinates separated choirs, instrumental colors, antiphonal exchange and massive sonorous blocks.",capacity:"Music can organize architecture and physical space as compositional parameters."},works:[{title:"In ecclesiis",year:"c. 1610",weighting:"Spatial choirs + soloists + instruments + continuo",intervention:"Contrasting forces answer and accumulate across an acoustic building.",capacity:"Listener location and reverberant space become parts of musical form."}]},
    {id:"monteverdi",name:"Claudio Monteverdi",type:"artist",years:"1567–1643",era:"Renaissance / Baroque",profile:{inherited:["Renaissance counterpoint","expressive madrigal","monody and continuo","court theater"],problem:"Contrapuntal correctness can weaken words, character and dramatic action.",intervention:"Lets text govern dissonance and centers solo voice, recitative, instrumental color and recurrence on embodied characters.",capacity:"Music can sustain dramatic consciousness and action in real time."},works:[{title:"Cruda Amarilli",year:"1605",weighting:"Madrigal counterpoint + text-led dissonance",intervention:"Expressive necessity is allowed to overrule inherited contrapuntal decorum.",capacity:"A work can argue for a new hierarchy of musical values."},{title:"L'Orfeo",year:"1607",weighting:"Recitative + song + chorus + instrumental color",intervention:"Multiple inherited practices become one continuous theatrical system.",capacity:"Opera becomes a durable machine for musical drama."}]},
    {id:"corelli",name:"Arcangelo Corelli",type:"artist",years:"1653–1713",era:"Baroque",profile:{inherited:["basso continuo","dance types","contrapuntal ensemble writing","emerging tonality and violin technique"],problem:"How can instrumental music establish clear direction and persuasive speech without words?",intervention:"Stabilizes sequential harmony, cadence, tonal plan and idiomatic violin dialogue.",capacity:"Instrumental music can narrate a legible journey through tonal space."},works:[{title:"Concerti grossi, Op. 6",year:"published 1714",weighting:"Concertino/tutti dialogue + tonal sequence + cadence",intervention:"Small and large ensembles become contrasting rhetorical agents.",capacity:"Tonal motion and changing scale can sustain public instrumental drama."}]},
    {id:"vivaldi",name:"Antonio Vivaldi",type:"artist",years:"1678–1741",era:"Baroque",profile:{inherited:["Corellian tonal syntax","concerto grosso","violin virtuosity","Venetian theatrical contrast"],problem:"How can an extended concerto remain legible while making space for individual virtuosity?",intervention:"Alternates recurring orchestral ritornellos with harmonically mobile solo episodes.",capacity:"Repetition and contrast can map large form; individual and collective can become dramatic roles."},works:[{title:"The Four Seasons",year:"c. 1718–1725",weighting:"Ritornello + virtuoso episode + pictorial gesture",intervention:"A repeatable concerto design carries sharply specific images and events.",capacity:"Abstract form and vivid programmatic narrative can reinforce each other."}]},
    {id:"bach",name:"Johann Sebastian Bach",type:"artist",years:"1685–1750",era:"Baroque",profile:{inherited:["Renaissance counterpoint","Lutheran chorale","Italian concerto","French dance","organ traditions","tonal harmony"],problem:"Can heterogeneous European systems operate simultaneously without collapsing into pastiche?",intervention:"Coordinates motive, line, harmony, dance, theology, timbre and large form at several scales at once.",capacity:"Maximum expressive freedom can emerge from an intensely integrated system."},works:[{title:"The Well-Tempered Clavier",year:"1722 / 1742",weighting:"Keyboard idiom + prelude/fugue + circulating tonality",intervention:"Every key becomes a site for a distinct relation between invention and contrapuntal consequence.",capacity:"A collection can demonstrate an entire compositional environment."},{title:"St Matthew Passion",year:"1727",weighting:"Counterpoint + chorale memory + dramatic narration",intervention:"Public ritual, private reflection and theatrical time are interlocked.",capacity:"A musical system can hold communal, dramatic and interior experience simultaneously."}]},
    {id:"handel",name:"George Frideric Handel",type:"artist",years:"1685–1759",era:"Baroque",profile:{inherited:["Italian opera","German counterpoint","French ceremonial style","English choral practice","commercial theater"],problem:"How can large learned music remain dramatically immediate for a paying urban public?",intervention:"Prioritizes memorable melody, theatrical characterization, direct rhetoric and adaptable opera/oratorio formats.",capacity:"Large-scale art music can function as public commercial entertainment without surrendering complexity."},works:[{title:"Messiah",year:"1741",weighting:"Oratorio + chorus + aria + scriptural compilation",intervention:"Operatic pacing and characterization are redirected into a concertable sacred form.",capacity:"A work can move among devotional, theatrical and civic identities."}]},
    {id:"cpe_bach",name:"Carl Philipp Emanuel Bach",type:"artist",years:"1714–1788",era:"Late Baroque / Classical",profile:{inherited:["late-Baroque syntax","keyboard improvisation","galant phrase structure","rhetorical affect"],problem:"Continuous contrapuntal flow can suppress interruption, surprise and volatile individual feeling.",intervention:"Uses abrupt changes of register, dynamics, texture, silence and harmony as speech-like gestures.",capacity:"Instrumental music can hesitate, interrupt, question and exclaim like an unstable speaker."},works:[{title:"Selected keyboard fantasias and sonatas",year:"mid-to-late 18th century",weighting:"Free fantasy + clear phrase + abrupt affective change",intervention:"Continuity yields to the psychology of the performing moment.",capacity:"Form can emerge from expressive volatility rather than smooth succession."}]},
    {id:"haydn",name:"Joseph Haydn",type:"artist",years:"1732–1809",era:"Classical",profile:{inherited:["galant rhetoric","tonal contrast","symphony and quartet","motivic development","court ensemble practice"],problem:"How can long instrumental meaning be sustained without text, program or ritornello?",intervention:"Fragments, redirects, delays and recombines small ideas so expectation itself becomes material.",capacity:"Form can become audible reasoning and social conversation."},works:[{title:"String Quartets, Op. 76",year:"1797–1799",weighting:"Four-part dialogue + motivic economy + formal surprise",intervention:"Every voice can redirect the argument while preserving a shared premise.",capacity:"A small ensemble can model collective intelligence."}]},
    {id:"mozart",name:"Wolfgang Amadeus Mozart",type:"artist",years:"1756–1791",era:"Classical",profile:{inherited:["Haydn's formal reasoning","Italian melody","opera","orchestra","counterpoint"],problem:"Can formal elegance contain conflicting personalities and simultaneous truths?",intervention:"Carries operatic characterization into ensembles and instrumental form; lets musical voices remain distinct while interacting structurally.",capacity:"Music can model social consciousness rather than a single point of view."},works:[{title:"The Marriage of Figaro",year:"1786",weighting:"Comic opera + ensemble accumulation + class conflict",intervention:"Characters preserve individual motives while musical form forces them into shared time.",capacity:"An ensemble can reveal a social system in motion."},{title:"Symphony No. 41, “Jupiter”",year:"1788",weighting:"Classical form + learned counterpoint + public brilliance",intervention:"Several motives become simultaneously compatible at the climax.",capacity:"Formal plurality can resolve as intelligible synthesis."}]},
    {id:"beethoven",name:"Ludwig van Beethoven",type:"artist",years:"1770–1827",era:"Classical / Romantic",profile:{inherited:["Haydn's motivic reasoning","Mozart's drama","sonata practice","public concert culture","revolutionary-era rhetoric"],problem:"Can a work appear to struggle with and transform its own conditions?",intervention:"Radicalizes motivic economy, rupture, dynamic conflict, long-range tension and transformative return.",capacity:"Abstract form can carry psychological, moral and historical experience."},works:[{title:"Symphony No. 5",year:"1808",weighting:"Minimal motive + conflict + long-range tonal return",intervention:"A tiny cell becomes an agent whose consequences reshape every scale of the work.",capacity:"Development can sound like irreversible transformation."},{title:"Late string quartets",year:"1824–1826",weighting:"Quartet discourse + fugue + variation + discontinuity",intervention:"Inherited genres are treated as a field of possible temporal and spiritual states.",capacity:"A work can expose the instability of its own historical language."}]},
    {id:"schubert",name:"Franz Schubert",type:"artist",years:"1797–1828",era:"Romantic",profile:{inherited:["Classical form","German poetry","domestic piano culture","folk-like song","Beethovenian development"],problem:"Must musical meaning arise from dramatic development, or can it emerge through memory and changed perspective?",intervention:"Uses lyrical repetition, harmonic drift, tonal remoteness and return to make time feel inward and recollective.",capacity:"Harmony can open an interior world; recurrence can register altered consciousness."},works:[{title:"Winterreise",year:"1827",weighting:"Song cycle + recurring figures + unstable tonal journey",intervention:"Voice and piano repeatedly reinterpret a narrowing psychological landscape.",capacity:"A sequence of songs can become a continuous interior drama."}]},
    {id:"chopin",name:"Frédéric Chopin",type:"artist",years:"1810–1849",era:"Romantic",profile:{inherited:["piano technology","salon culture","bel canto","Polish dance","Bach and Classical form"],problem:"How can one instrument sustain a complete poetic identity rather than imitate an orchestra?",intervention:"Rebuilds harmony, rhythm, ornament, touch and national dance around the physical intimacy of the piano.",capacity:"Instrumental technique can become inseparable from personal voice and cultural memory."},works:[{title:"Mazurkas",year:"1825–1849",weighting:"Polish dance + chromatic harmony + intimate miniature",intervention:"Accent, timing and modal inflection destabilize cosmopolitan piano syntax from within.",capacity:"A small form can carry place, memory and private modernity."}]},
    {id:"berlioz",name:"Hector Berlioz",type:"artist",years:"1803–1869",era:"Romantic",profile:{inherited:["Beethovenian symphony","French theater","literary program","expanding orchestra"],problem:"Can an instrumental symphony stage a specific hallucinated narrative and a recurring subjectivity?",intervention:"Uses the idée fixe, radical orchestration, spatial effects and episodic program to bind music to imagined events.",capacity:"The orchestra can construct a cinematic psychological world."},works:[{title:"Symphonie fantastique",year:"1830",weighting:"Symphony + idée fixe + orchestral theater",intervention:"A recurring melody changes identity as the protagonist's perception changes.",capacity:"Timbre and recurrence can narrate a mind across discontinuous scenes."}]},
    {id:"liszt",name:"Franz Liszt",type:"artist",years:"1811–1886",era:"Romantic",profile:{inherited:["virtuoso piano culture","Beethovenian transformation","program music","operatic spectacle"],problem:"Can virtuosity generate form and transfigure one identity rather than merely decorate it?",intervention:"Turns thematic transformation, pianistic sonority and public persona into organizing forces.",capacity:"A motive can pass through multiple characters while remaining structurally continuous."},works:[{title:"Piano Sonata in B minor",year:"1853",weighting:"One-movement form + thematic transformation + virtuoso sonority",intervention:"A small family of ideas assumes contrasting formal roles across an uninterrupted span.",capacity:"Large form can be generated through metamorphosis rather than separate themes."}]},
    {id:"wagner",name:"Richard Wagner",type:"artist",years:"1813–1883",era:"Romantic",profile:{inherited:["opera","Beethovenian continuity","mythic drama","chromatic harmony","expanded orchestra"],problem:"How can music sustain an immersive dramatic world across enormous spans without conventional stop-and-start numbers?",intervention:"Integrates leitmotif, chromatic deferral, orchestral memory, text and staging into continuous music drama.",capacity:"Music can behave as a world-model whose motives remember what characters cannot say."},works:[{title:"Tristan und Isolde",year:"1859 / 1865",weighting:"Chromatic deferral + leitmotif + continuous drama",intervention:"Cadential desire is prolonged until harmony itself embodies unsatisfied longing.",capacity:"Tonal syntax can represent psychological suspension."}]},
    {id:"brahms",name:"Johannes Brahms",type:"artist",years:"1833–1897",era:"Romantic",profile:{inherited:["Beethovenian form","Bachian counterpoint","Schubertian lyricism","Romantic harmony","historical concert canon"],problem:"How can inherited forms remain alive after their gestures have become monumental conventions?",intervention:"Compresses developing variation, rhythmic displacement, contrapuntal memory and dense motivic relation inside traditional genres.",capacity:"Historical continuity can itself become a modern, self-questioning practice."},works:[{title:"Symphony No. 4",year:"1885",weighting:"Symphonic argument + developing variation + passacaglia",intervention:"An archaic repeating bass supports continuous motivic transformation and tragic closure.",capacity:"Restriction and historical memory can intensify rather than limit invention."}]},
    {id:"debussy",name:"Claude Debussy",type:"artist",years:"1862–1918",era:"Late Romantic / modernist",profile:{inherited:["Wagnerian chromatic color","French poetry","modal and whole-tone resources","non-European music heard in Paris","orchestral tradition"],problem:"Goal-directed harmony and developmental rhetoric can make every sound subordinate to arrival.",intervention:"Treats timbre, register, mode, resonance and juxtaposed blocks as primary form-bearing materials.",capacity:"Music can unfold as an environment of changing perception rather than a directed argument."},works:[{title:"Prélude à l'après-midi d'un faune",year:"1894",weighting:"Orchestral color + ambiguous pitch field + fluid phrase",intervention:"Timbre and harmonic ambiguity suspend ordinary formal gravity.",capacity:"Color can articulate time without traditional development."},{title:"La mer",year:"1905",weighting:"Orchestral process + cyclic memory + mobile texture",intervention:"Form behaves like a changing natural system rather than a fixed narrative plan.",capacity:"Large-scale motion can be perceived through transformation of texture and light."}]},
    {id:"mahler",name:"Gustav Mahler",type:"artist",years:"1860–1911",era:"Late Romantic / modernist",profile:{inherited:["Beethovenian symphony","Wagnerian orchestra","song","march and dance","vernacular and sacred signs","modern urban fragmentation"],problem:"How can the symphony contain incompatible public, private, sacred, banal and catastrophic worlds?",intervention:"Builds enormous forms from quotation-like styles, abrupt ruptures, extreme scale, orchestral perspective and transforming returns.",capacity:"A single work can hold a plural, unstable totality without reconciling all of it."},works:[{title:"Symphony No. 5",year:"1901–1902",weighting:"Funeral march + counterpoint + dance + intimate adagietto",intervention:"Contradictory genres and emotional scales are made chapters of one transformative arc.",capacity:"Symphonic identity can be the difficult coexistence of incompatible selves."}]},
    {id:"joplin",name:"Scott Joplin",type:"artist",years:"c. 1868–1917",era:"Ragtime",profile:{inherited:["African American syncopation","march and dance forms","European harmony","piano and sheet-music markets"],problem:"How can layered vernacular rhythm become a durable composed form in a racist commercial culture?",intervention:"Notates syncopated melodic rhythm against a steady bass inside balanced multi-strain designs.",capacity:"Rhythmic contradiction can become the central identity of a repeatable composed work."},works:[{title:"Maple Leaf Rag",year:"1899",weighting:"Syncopation + march strains + piano publication",intervention:"Successive strains intensify the friction between regular bass and displaced melody.",capacity:"A printed piano work can circulate a new rhythmic logic at mass scale."}]},
    {id:"armstrong",name:"Louis Armstrong",type:"artist",years:"1901–1971",era:"Jazz",profile:{inherited:["New Orleans ensemble jazz","blues inflection","ragtime rhythm","brass-band practice","recording"],problem:"How can improvised performance become a coherent personal statement rather than one layer of collective texture?",intervention:"Centers the soloist through phrasing, swing, timbral identity, rhythmic displacement and recorded improvisational form.",capacity:"The individual improvised voice can reorganize an ensemble and become a durable authored event."},works:[{title:"West End Blues",year:"1928",weighting:"Blues form + trumpet cadenza + recorded ensemble",intervention:"The opening solo establishes a complete personal time-feel before the band enters.",capacity:"A recorded improvisation can become a canonical composition-like object."}]},
    {id:"ellington",name:"Duke Ellington",type:"artist",years:"1899–1974",era:"Jazz",profile:{inherited:["jazz orchestra","blues","Harlem theater and dance","individual improvisers","recording and radio"],problem:"How can a large band preserve singular Black voices while achieving composed orchestral identity?",intervention:"Writes for the irreplaceable timbres and personalities of specific players; treats orchestration as social portraiture.",capacity:"An ensemble can be a compositional instrument whose members are structural materials."},works:[{title:"Black and Tan Fantasy",year:"1927",weighting:"Blues + growl timbre + jazz orchestra + quotation",intervention:"Contrasting cultural signs are staged through the band's unique voices.",capacity:"Orchestration can articulate racial history, irony and identity."}]},

        {title:"Kind of Blue",year:"1959",problem:"What happens if improvisers are given dramatically less harmonic information?",weighting:"Modal fields + sparse sketches + elite improvisers + acoustic space",intervention:"Reduces harmonic prescription so melody, tone, phrasing, listening and silence acquire more structural weight.",capacity:"Removing one kind of complexity can enlarge another: the improviser can inhabit a harmonic environment instead of continually negotiating chord succession."},
        {title:"Miles Smiles",year:"1967",problem:"What if musicians understand post-bop rules so well that the rules themselves have become predictable?",weighting:"Second Great Quintet + unstable meter + flexible harmony + reduced accompaniment rules",intervention:"Destabilizes the support system; familiar accompaniment behaviors can be withheld so every player must continuously infer and renegotiate the form.",capacity:"Constraint can generate responsive freedom; accompaniment can become an active field of decision rather than a fixed service role."},

        {title:"1973–1975 live electric period",year:"1973–1975",problem:"How far can the system move from discrete compositions toward an uninterrupted collective event?",weighting:"Amplified groove + wah/effects + electric rhythm section + cues + long continuous performance",intervention:"Themes and tunes become waypoints inside an evolving high-density field governed by gesture, rhythm and ensemble reaction.",capacity:"Concert form can become a continuous environment rather than a sequence of self-contained works."},

    {id:"part",name:"Arvo Pärt",type:"artist",years:"born 1935",era:"Sacred minimalism",profile:{inherited:["serial modernism","early sacred music","Orthodox spirituality","triadic harmony","silence"],problem:"How can composition continue after the artist's own complex modernist language has become spiritually unusable?",intervention:"Creates tintinnabuli: constrained relations between stepwise voice and triadic voice, framed by silence.",capacity:"Severe reduction can carry ethical weight, vulnerability and sacred time."},works:[{title:"Tabula Rasa",year:"1977",weighting:"Tintinnabuli + double violin + prepared piano + silence",intervention:"Simple pitch rules generate fragile, slowly clearing relationships.",capacity:"A personal system can make restraint more consequential than novelty."}]},
    {id:"korngold",name:"Erich Wolfgang Korngold",type:"artist",years:"1897–1957",era:"Film / late Romantic",profile:{inherited:["late-Romantic opera","Wagnerian leitmotif","Viennese orchestration","Hollywood studio system","synchronized film"],problem:"How can symphonic music clarify fast visual narrative without becoming mere background?",intervention:"Adapts operatic leitmotif, thematic continuity and saturated orchestral color to editing, character and screen action.",capacity:"The symphonic score can bind a film into a coherent emotional and mythic world."},works:[{title:"The Adventures of Robin Hood",year:"1938",weighting:"Leitmotif + symphonic action writing + studio orchestra",intervention:"Themes track characters and action while bridging cuts and changes of location.",capacity:"A film score can carry narrative memory across discontinuous images."}]},
    {id:"herrmann",name:"Bernard Herrmann",type:"artist",years:"1911–1975",era:"Film",profile:{inherited:["modernist harmony","radio drama","orchestral color","leitmotif","unusual ensembles"],problem:"How can film music expose subjective pressure rather than merely decorate external action?",intervention:"Uses obsessive cells, restricted timbral palettes, dissonance, repetition and psychologically exact orchestration.",capacity:"A score can function as the film's hidden nervous system."},works:[{title:"Psycho",year:"1960",weighting:"String orchestra + repeated cells + extreme attack",intervention:"A restricted ensemble becomes both intimate psychological pressure and physical violence.",capacity:"Constraint and timbre can define an entire cinematic reality."}]},
    {id:"williams",name:"John Williams",type:"artist",years:"born 1932",era:"Film",profile:{inherited:["Korngoldian symphonic cinema","leitmotif","modernist orchestration","jazz and television craft","Hollywood blockbuster"],problem:"How can a modern mass film achieve immediate mythic clarity while sustaining dense narrative recall?",intervention:"Resynthesizes memorable themes, motivic networks, orchestral virtuosity and precise synchronization.",capacity:"A contemporary score can act as public mythology and long-range narrative memory."},works:[{title:"Star Wars",year:"1977",weighting:"Leitmotif + late-Romantic orchestra + serial adventure",intervention:"Distinct themes orient character, moral force and place across rapid cinematic change.",capacity:"Thematic orchestral language can remain globally legible in modern media."}]},
    {id:"zimmer",name:"Hans Zimmer",type:"artist",years:"born 1957",era:"Film / hybrid studio",profile:{inherited:["symphonic scoring","synthesizers","pop production","minimalist pulse","digital sampling and sound design"],problem:"How can a score produce contemporary scale and identity when orchestral language alone feels inherited and the film mix is sonically dense?",intervention:"Builds hybrid systems of pulse, processed instruments, samples, electronics, orchestra and collaborative production.",capacity:"Film scoring can merge composition, production and sound design into one scalable architecture."},works:[{title:"Inception",year:"2010",weighting:"Processed brass + slowed-source idea + pulse + electronic/orchestral mass",intervention:"A small temporal concept governs both musical identity and the film's nested scale.",capacity:"Production design can become a score's generative compositional rule."}]},
    {id:"beatles",name:"The Beatles",type:"artist",years:"1960–1970",era:"Recorded popular music",profile:{inherited:["rock and roll and R&B","vocal harmony","Tin Pan Alley song","British music hall","tape and multitrack studio","producer George Martin"],problem:"Can a touring pop group keep expanding musical identity beyond what four players can reproduce onstage?",intervention:"Makes collective songwriting, arrangement, tape manipulation, orchestration and George Martin's production part of the band's stable creative system.",capacity:"The recording—not a live performance of it—can be the primary work, while the group remains recognizably itself through changing materials."},works:[{title:"Revolver",year:"1966",weighting:"Compact song + Indian instruments + tape loops + close studio craft",intervention:"Each track selects a different sound-world while sequencing turns disparity into an album identity.",capacity:"A pop group can use the studio as a compositional instrument without abandoning concise song."},{title:"Sgt. Pepper's Lonely Hearts Club Band",year:"1967",weighting:"Alter ego + album sequence + orchestration + studio illusion",intervention:"A fictional frame releases the group from literal stage identity.",capacity:"The album can present a designed world larger than the performing band."}]},
    {id:"beach_boys",name:"Brian Wilson / The Beach Boys",type:"artist",years:"1961–",era:"Recorded popular music",profile:{inherited:["vocal-group harmony","surf and rock song","Phil Spector's production","session musicians","multitrack recording"],problem:"How can emotionally vulnerable inner experience inhabit mass-market pop without relying on confessional plainness?",intervention:"Layers unusual instruments, modular arrangements, harmonic color and intricately voiced vocals under Brian Wilson's studio direction.",capacity:"Pop production can make arrangement itself a form of intimate psychological composition."},works:[{title:"Pet Sounds",year:"1966",weighting:"Vocal harmony + modular studio arrangement + chamber-like timbre",intervention:"Songs are built as finely balanced recorded environments rather than band performances.",capacity:"An album's production language can carry a continuous emotional point of view."}]},
    {id:"king_tubby",name:"King Tubby",type:"artist",years:"1941–1989",era:"Dub",profile:{inherited:["Jamaican sound-system culture","reggae rhythm tracks","mixing console","tape delay and reverb","version sides"],problem:"What remains of a song when performance is already recorded and the mixer can alter its internal space in real time?",intervention:"Drops voices and instruments in and out, sends fragments through echo and reverb, and performs the console as an instrument.",capacity:"A recording can be recomposed through subtraction, spatialization and versioning; the mix can be the performance."},works:[{title:"King Tubby Meets Rockers Uptown",year:"1974",weighting:"Existing rhythm track + live console moves + delay/reverb",intervention:"Bass, drum, voice fragments and echo continually exchange foreground and absence.",capacity:"Negative space and signal routing can generate form."}]},
    {id:"kraftwerk",name:"Kraftwerk",type:"artist",years:"1970–",era:"Electronic popular music",profile:{inherited:["German experimental rock","minimal repetition","electronic studio","pop song","modern transport and machine imagery"],problem:"Can electronic music form a complete popular identity rather than imitate rock instrumentation or remain an avant-garde specialty?",intervention:"Aligns synthetic timbre, machine pulse, reduced melody, graphic persona and conceptual albums into a coherent human-machine system.",capacity:"Electronic production can be the native body, rhythm and public image of a pop group."},works:[{title:"Trans-Europe Express",year:"1977",weighting:"Sequenced pulse + synthetic voice + transport concept + album flow",intervention:"Mechanical repetition becomes both groove and a model of connected modern geography.",capacity:"A pop album can turn a technical process into a social and aesthetic identity."}]},
    {id:"grandmaster_flash",name:"Grandmaster Flash and the Furious Five",type:"artist",years:"1978–",era:"Hip-hop",profile:{inherited:["Bronx block-party culture","funk breaks","turntables and mixer","MC performance","record collecting"],problem:"How can the most kinetic moments of existing records be prolonged, reorganized and made available for new public speech?",intervention:"Refines break extension and turntable control while MC voices turn playback into coordinated live composition.",capacity:"Recorded history can become an instrument; selection, repetition and juxtaposition can author a new work."},works:[{title:"The Adventures of Grandmaster Flash on the Wheels of Steel",year:"1981",weighting:"Multiple records + live turntable mix + quotation",intervention:"Fragments from distinct recordings are synchronized into one performed montage.",capacity:"A commercially released recording can document playback itself as virtuoso composition."}]},
    {id:"eno",name:"Brian Eno",type:"artist",years:"born 1948",era:"Studio / ambient",profile:{inherited:["art rock","tape and synthesizer","experimental process","minimal repetition","record production"],problem:"How can authorship move away from expressive command without surrendering aesthetic intention?",intervention:"Designs rules, prompts, studio systems and environments that generate more detail than the composer explicitly specifies.",capacity:"The artist can compose conditions and probabilities; a recording can function as an environment rather than an event."},works:[{title:"Another Green World",year:"1975",weighting:"Studio miniature + instrumental guests + Oblique Strategies + electronic color",intervention:"Brief pieces emerge from designed constraints and transformed instrumental roles.",capacity:"Production method can stabilize identity across otherwise heterogeneous materials."},{title:"Ambient 1: Music for Airports",year:"1978",weighting:"Tape loops + sparse tonal fragments + architectural function",intervention:"Independent loops create non-repeating relations at the edge of attention.",capacity:"Music can accommodate environmental use and variable listening depth."}]},
    {id:"pink_floyd",name:"Pink Floyd",type:"artist",years:"1965–1995 / 2005 / 2014",era:"Art rock",profile:{inherited:["psychedelic rock","blues-based band","tape and studio effects","electronic instruments","extended album form"],problem:"How can a rock group sustain psychological space and conceptual continuity beyond the individual song?",intervention:"Coordinates repetition, sound effects, patient instrumental scale, studio transitions and album-level concepts.",capacity:"A rock album can operate as an immersive narrative and acoustic architecture."},works:[{title:"The Dark Side of the Moon",year:"1973",weighting:"Rock song + synthesizer + tape montage + continuous album arc",intervention:"Transitions, recurring sounds and conceptual themes bind discrete songs into one environment.",capacity:"The studio album can become a socially legible total world."}]},
    {id:"magazine",name:"Magazine",type:"artist",years:"1977–1981 / later reunions",era:"Post-punk",profile:{inherited:["punk rupture","art rock","keyboards and studio texture","literary vocal persona"],problem:"How can punk's break with rock convention support compositional sophistication without returning to progressive-rock display?",intervention:"Combines angular guitar, synthetic color, tense rhythm and controlled, alienated songcraft.",capacity:"Post-punk can be harmonically and texturally expansive while preserving critical distance."},works:[{title:"Real Life",year:"1978",weighting:"Punk economy + keyboards + art-rock harmony + nervous rhythm",intervention:"Sophisticated arrangements are made to feel unstable rather than monumental.",capacity:"Rock complexity can signify fracture instead of mastery."}]},
    {id:"joy_division",name:"Joy Division",type:"artist",years:"1976–1980",era:"Post-punk",profile:{inherited:["punk economy","Krautrock repetition","industrial Manchester","dub-like recorded space","Martin Hannett's production"],problem:"How can a four-piece rock band make inner estrangement audible without relying on virtuoso excess?",intervention:"Separates bass, drums, guitar and voice into stark roles; uses repetition, negative space and production as psychological architecture.",capacity:"Band minimalism and studio distance can make alienation structural rather than merely lyrical."},works:[{title:"Unknown Pleasures",year:"1979",weighting:"Sparse band parts + repetitive pulse + cavernous production",intervention:"Each instrument occupies an isolated acoustic zone while groove holds the system together.",capacity:"A recorded band can sound like a built interior state."}]},
    {id:"new_order",name:"New Order",type:"artist",years:"1980–",era:"Post-punk / electronic dance",profile:{inherited:["Joy Division's ensemble memory","club culture","sequencers and drum machines","independent-label infrastructure","pop song"],problem:"Can a group survive the loss of its defining voice without imitating its former identity?",intervention:"Redistributes authorship and combines live band fallibility with programmed electronic pulse and dance-floor form.",capacity:"Collective identity can persist through a change in genre, technology and emotional stance."},works:[{title:"Power, Corruption & Lies",year:"1983",weighting:"Guitar/bass band + sequencer + synthetic rhythm + fragile voice",intervention:"Human and machine time coexist without one becoming ornamental.",capacity:"Post-punk introspection and dance-floor propulsion can form one band language."}]},
    {id:"rem",name:"R.E.M.",type:"artist",years:"1980–2011",era:"Alternative rock",profile:{inherited:["post-punk independence","folk-rock jangle","American regional touring","college radio","ensemble songwriting"],problem:"How can a band build durable public reach outside dominant hard-rock and pop conventions?",intervention:"Makes cryptic voice, interdependent guitar/bass/drum texture and long-term collective authorship the basis of an independent career.",capacity:"Alternative rock can become a sustainable institution without beginning as mainstream spectacle."},works:[{title:"Murmur",year:"1983",weighting:"Jangle + opaque vocal + ensemble texture + restrained production",intervention:"No single part fully explains the song; meaning emerges from the band's blended surface.",capacity:"Indeterminacy and regional particularity can become accessible rock identity."}]},
    {id:"the_fall",name:"The Fall",type:"artist",years:"1976–2018",era:"Post-punk",profile:{inherited:["garage rock","punk repetition","spoken vernacular","unstable personnel","independent recording"],problem:"Can a group remain itself when polish, stable membership and stylistic progress are refused?",intervention:"Centers Mark E. Smith's editorial voice while using repetition, abrasion and continually replaced collaborators as a production system.",capacity:"Artist identity can reside in a method of selection and pressure rather than a fixed lineup or sound."},works:[{title:"Hex Enduction Hour",year:"1982",weighting:"Repetition + twin drums + abrasive guitar + spoken command",intervention:"Accumulation and insistence replace conventional refinement.",capacity:"A record can turn recalcitrance into coherent form."}]},
    {id:"talking_heads",name:"Talking Heads",type:"artist",years:"1975–1991",era:"Post-punk / art rock",profile:{inherited:["punk minimalism","art-school conceptualism","funk and Afro-diasporic groove","studio collaboration with Brian Eno","pop song"],problem:"How can cerebral self-consciousness enter the body and become collective without pretending anxiety has vanished?",intervention:"Layers interlocking rhythm, repeated cells, found vocal approaches and studio-built ensemble expansion around an identifiable core band.",capacity:"Art-rock analysis and participatory groove can coexist as one unstable social machine."},works:[{title:"Remain in Light",year:"1980",weighting:"Loop-like ensemble cells + funk-derived groove + Eno studio process + edited vocals",intervention:"Songs are assembled from collective rhythmic layers before conventional lead parts are assigned.",capacity:"A rock band can compose by building a distributed groove system."}]},
    {id:"pixies",name:"Pixies",type:"artist",years:"1986–1993 / 2004–",era:"Alternative rock",profile:{inherited:["punk brevity","surf guitar","pop hooks","abrasive noise","college-rock circuit"],problem:"How can compact guitar songs hold both melodic invitation and bodily rupture?",intervention:"Weaponizes sudden loud/quiet contrast, clipped surreal form, scream and concise hook.",capacity:"Dynamic discontinuity can become a repeatable pop grammar rather than a one-time effect."},works:[{title:"Doolittle",year:"1989",weighting:"Hook + abrasion + loud/quiet contrast + compressed song form",intervention:"Violent shifts arrive before listeners can normalize either intimacy or force.",capacity:"Alternative rock can make instability immediately memorable."}]},
    {id:"can",name:"Can",type:"artist",years:"1968–1979 / reunions",era:"Experimental rock",profile:{inherited:["free improvisation","modernist composition","rock instrumentation","tape editing","repetitive groove"],problem:"How can extended group improvisation avoid both soloist hierarchy and shapeless documentation?",intervention:"Builds collective pulse, restricted parts and long sessions that Holger Czukay edits into decisive studio forms.",capacity:"A band can compose through sustained group process plus retrospective editing."},works:[{title:"Tago Mago",year:"1971",weighting:"Repetitive ensemble + improvisation + tape edit + altered voice",intervention:"Groove provides continuity while studio cuts expose radically different states of the same collective.",capacity:"Rock identity can persist across song, trance and sonic experiment."}]},
    {id:"aphex_twin",name:"Aphex Twin",type:"artist",years:"1985–",era:"Electronic music",profile:{inherited:["acid house and techno","home electronic studio","ambient music","drum-machine programming","rave culture"],problem:"Must electronic dance language remain functionally tied to a dance floor or standardized machine behavior?",intervention:"Pushes idiosyncratic synthesis, micro-rhythm, melody, speed and domestic studio experimentation into a singular personal system.",capacity:"Programmed sound can carry intimate, comic, violent and uncanny authorship at once."},works:[{title:"Selected Ambient Works 85–92",year:"1992",weighting:"Machine pulse + blurred melody + home-recorded atmosphere",intervention:"Dance-derived repetition is made private, worn and emotionally ambiguous.",capacity:"Electronic tracks can feel like remembered places rather than demonstrations of technology."}]},
    {id:"autechre",name:"Autechre",type:"artist",years:"1987–",era:"Electronic music",profile:{inherited:["electro and hip-hop rhythm","techno","digital synthesis","sequencing","generative systems"],problem:"How far can electronic form leave familiar bodily and instrumental cues while remaining internally coherent?",intervention:"Designs evolving rule systems, synthetic timbres and multi-scale rhythmic relations that resist easy source identification.",capacity:"A track can be heard as the behavior of an unfamiliar constructed system."},works:[{title:"Tri Repetae",year:"1995",weighting:"Machine rhythm + synthetic material + gradual mutation",intervention:"Small changes in density and timbre reveal form inside apparently impersonal repetition.",capacity:"Electronic abstraction can acquire weight, space and physical agency."}]},
    {id:"boards_of_canada",name:"Boards of Canada",type:"artist",years:"1986–",era:"Electronic music",profile:{inherited:["analog synthesizer","hip-hop beat","educational film and broadcast sound","tape degradation","ambient form"],problem:"How can electronic production evoke memory without simply quoting a past style?",intervention:"Builds detuned melody, degraded media texture, recurring symbols and understated beats into an invented archive.",capacity:"Production artifacts can act as emotional memory even when no specific memory is named."},works:[{title:"Music Has the Right to Children",year:"1998",weighting:"Analog melody + sampled voice + worn tape + hip-hop-derived beat",intervention:"Familiar media residues are recombined into a childhood that feels shared but cannot be located.",capacity:"Electronic timbre can create collective false memory."}]},

    {id:"radiohead",name:"Radiohead",type:"artist",years:"1985–",era:"Alternative rock / electronic art music",profile:{inherited:["guitar-based alternative rock","post-punk ensemble logic","Beatles-era studio composition","art-rock album scale","modernist timbre and rhythm","jazz ensemble and harmony","electronic process and sampling"],problem:"How can a successful guitar band express technological alienation and changing inner life after its own rock language has become a trap?",intervention:"Relocates band identity from fixed instruments or genre to a stable decision-making relationship among five members, with Nigel Godrich and the studio as recurring parts of the system. Guitar, voice, drums, strings, electronics, software and editing can continually exchange roles.",capacity:"A rock band can abandon rock's fixed materials without abandoning collective identity: it becomes an adaptive compositional institution."},works:[{title:"Pablo Honey",year:"1993",problem:"How can the young band enter the existing alternative-rock field?",weighting:"Post-grunge guitar + direct song + Thom Yorke's high-intensity voice",intervention:"The record establishes the band's initial public components more than it transforms them.",capacity:"A baseline band identity exists against which later reweightings can be heard."},{title:"The Bends",year:"1995",problem:"How can guitar rock carry vulnerability without losing physical scale?",weighting:"Magazine/Pixies-like tension + layered guitars + melodic songcraft + dynamic release",intervention:"Guitars become an orchestral field around an exposed vocal subject rather than a single riff machine.",capacity:"Alternative rock can sound simultaneously intimate, architectural and unstable."},{title:"OK Computer",year:"1997",problem:"How can the band represent networked modern life without writing a literal concept narrative?",weighting:"Beatles/studio construction + art-rock album world + post-punk estrangement + DJ Shadow-like rhythmic montage",intervention:"Songs, transitions, processed voices and recurring perspectives form a distributed social environment.",capacity:"A rock album can model technological alienation as a system rather than a theme."},{title:"Kid A",year:"2000",problem:"How can the band escape the authority of the successful language it perfected on OK Computer?",weighting:"Aphex Twin/Autechre electronic process + Can-like repetition + jazz flow + modernist timbre",intervention:"Voice, guitar and live-band hierarchy are demoted; loops, editing, synthetic sound and provisional performance determine form.",capacity:"A famous rock band can suspend the genre's material contract while remaining recognizably the same collective intelligence."},{title:"Amnesiac",year:"2001",problem:"What other identities were latent inside the Kid A sessions?",weighting:"Electronic studio + jazz/cabaret gesture + collage + acoustic residue",intervention:"Related materials are sequenced as a dirtier, historical and more unstable companion world.",capacity:"The same creative process can yield incompatible album identities through selection and weighting."},{title:"Hail to the Thief",year:"2003",problem:"Can live urgency, political anxiety, guitar attack and electronic practice coexist after the Kid A rupture?",weighting:"Band performance + electronics + folk/hymn trace + rapid studio decisions",intervention:"Previously separated Radiohead modes are forced into tense coexistence rather than clean synthesis.",capacity:"A mature artist system can expose conflict among its own capacities as form."},{title:"In Rainbows",year:"2007",problem:"How can the expanded system become embodied and intimate rather than dystopian or demonstrative?",weighting:"Interlocking guitar + odd meter + supple groove + close voice + restrained production",intervention:"Complex rhythmic and harmonic relations are made to feel bodily, warm and unforced.",capacity:"Technical intricacy can disappear into intimacy and ensemble touch."},{title:"The King of Limbs",year:"2011",problem:"Can a five-person band derive live identity from looped and sampled process?",weighting:"Custom software + sampled performance + polyrhythmic loops + minimalist accumulation",intervention:"Members record fragments, reorganize them digitally, then reverse-engineer the constructed result for ensemble performance.",capacity:"A band can move cyclically between human performance and machine recomposition."},{title:"A Moon Shaped Pool",year:"2016",problem:"How can long personal history and accumulated technique be held without a triumphal summation?",weighting:"Mature song + Jonny Greenwood's string writing + tape/software + chamber and film-score color",intervention:"Older songs, orchestral modernism and digital studio practice are made to coexist as fragile memory.",capacity:"A late-career album can make the archive of an artist system sound present, unresolved and mortal."}]},

function legendHtml(n){if(n.type!=='system'||!data.relationshipClasses)return '';return `<div class="section"><h3>How to read an edge</h3>${Object.entries(data.relationshipClasses).map(([k,v])=>`<div class="profileBlock" style="margin-top:7px"><h4>${esc(humanize(k))}</h4><p>${esc(v)}</p></div>`).join('')}</div>`}
function renderPanel(){const n=data.nodes.find(x=>x.id===selectedId)||data.nodes[0];if(!n)return;const related=data.edges.map((e,idx)=>({e,idx})).filter(x=>x.e.source===n.id||x.e.target===n.id).map(x=>{const e=x.e,out=e.source===n.id,other=data.nodes.find(y=>y.id===(out?e.target:e.source));return {idx:x.idx,dir:out?'→':'←',type:e.type,cls:e.relationshipClass||'capability_inheritance',notes:e.notes||'',other}}).filter(x=>x.other);
 const meta=[n.type,n.years,n.era,`${related.length} connection${related.length===1?'':'s'}`].filter(Boolean).map(x=>`<span class="pill">${esc(x)}</span>`).join('');
 const connections=`<div class="section"><h3>Connections</h3>${related.length?related.map(r=>`<div class="edge ${selectedEdgeIdx===r.idx?'edgeSelected':''}"><div class="edgeMain"><div class="edgeJump" data-jump="${esc(r.other.id)}"><b>${r.dir} ${esc(r.other.name)}</b><small><span class="relationClass">${esc(humanize(r.cls))}</span>${esc(r.type)}${r.notes?' · '+esc(r.notes):''}</small></div><div class="edgeActions"><button onclick="showEditEdge(${r.idx});event.stopPropagation()">Edit</button><button class="danger" onclick="deleteEdge(${r.idx});event.stopPropagation()">Delete</button></div></div></div>`).join(''):'<div class="muted">No connections.</div>'}</div>`;
 const tools=`<div class="toolbar"><button onclick="showEditNode()">Edit node</button><button onclick="showAddNode()">Add node</button><button onclick="showAddEdge()">Add edge</button><button onclick="exportData()">Export JSON</button><button onclick="document.getElementById('importFile').click()">Import JSON</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"><button class="danger" onclick="resetSeed()">Restore seed</button></div><div class="status">Changes are stored in this browser using local storage.</div>`;
 const html=`<div class="nodeTitle">${esc(n.name)}</div><div>${meta}</div>${profileHtml(n)}${worksHtml(n)}${legendHtml(n)}${connections}${tools}`;
 document.getElementById('panel').innerHTML=html;document.getElementById('mobilePanel').innerHTML=html;document.querySelectorAll('[data-jump]').forEach(el=>el.onclick=()=>{selectedId=el.dataset.jump;selectedEdgeIdx=null;renderPanel()})}
function editForm(mode){const n=mode==='edit'?data.nodes.find(x=>x.id===selectedId):{id:'',name:'',type:'artist',notes:''};const del=mode==='edit'?`<button class="danger" onclick="deleteNode('${attr(n.id)}')">Delete node</button>`:'';return `<div class="form"><label>Name<input id="fName" value="${attr(n.name)}"></label><label>Type<input id="fType" value="${attr(n.type)}"></label><label>Notes<textarea id="fNotes">${esc(n.notes||'')}</textarea></label><button onclick="saveNode('${mode}')">Save</button>${del}<button onclick="renderPanel()">Cancel</button></div>`}
function showEditNode(){setPanels(editForm('edit'))} function showAddNode(){setPanels(editForm('add'))}
function edgeOptions(selected){return data.nodes.map(n=>`<option value="${attr(n.id)}" ${n.id===selected?'selected':''}>${esc(n.name)}</option>`).join('')}
function relationClassOptions(selected){return Object.keys(data.relationshipClasses||SEED.relationshipClasses).map(k=>`<option value="${attr(k)}" ${k===selected?'selected':''}>${esc(humanize(k))}</option>`).join('')}
function showAddEdge(){selectedEdgeIdx=null;setPanels(`<div class="form"><div class="nodeTitle">Add relationship</div><label>From<select id="eFrom">${edgeOptions(selectedId)}</select></label><label>Relationship class<select id="eClass">${relationClassOptions('capability_inheritance')}</select></label><label>Relationship<input id="eType" placeholder="What passes, corresponds, or supplies context?"></label><label>To<select id="eTo">${edgeOptions('')}</select></label><label>Notes<textarea id="eNotes"></textarea></label><button onclick="saveEdge()">Save edge</button><button onclick="renderPanel()">Cancel</button></div>`)}
function showEditEdge(idx){const e=data.edges[idx];if(!e)return;selectedEdgeIdx=idx;const a=data.nodes.find(n=>n.id===e.source),b=data.nodes.find(n=>n.id===e.target);setPanels(`<div class="form"><div class="nodeTitle">Edit relationship</div><div class="muted">${esc(a?.name||e.source)} → ${esc(b?.name||e.target)}</div><label>From<select id="eFrom">${edgeOptions(e.source)}</select></label><label>Relationship class<select id="eClass">${relationClassOptions(e.relationshipClass||'capability_inheritance')}</select></label><label>Relationship<input id="eType" value="${attr(e.type||'')}"></label><label>To<select id="eTo">${edgeOptions(e.target)}</select></label><label>Notes<textarea id="eNotes">${esc(e.notes||'')}</textarea></label><button onclick="saveEditedEdge(${idx})">Save changes</button><button class="danger" onclick="deleteEdge(${idx})">Delete relationship</button><button onclick="selectedEdgeIdx=null;renderPanel()">Cancel</button></div>`)}
function setPanels(html){document.getElementById('panel').innerHTML=html;document.getElementById('mobilePanel').innerHTML=html}
function slug(s){let base=s.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||'node',id=base,i=2;while(data.nodes.some(n=>n.id===id))id=base+'_'+i++;return id}
function saveNode(mode){const name=val('fName').trim(),type=val('fType').trim()||'unknown',notes=val('fNotes').trim();if(!name)return alert('Name is required.');if(mode==='edit'){const n=data.nodes.find(x=>x.id===selectedId);Object.assign(n,{name,type,notes})}else{const id=slug(name);data.nodes.push({id,name,type,notes});selectedId=id}saveData();rebuild()}
function saveEdge(){const source=val('eFrom'),target=val('eTo'),relationshipClass=val('eClass')||'capability_inheritance',type=val('eType').trim()||'related to',notes=val('eNotes').trim();if(source===target)return alert('Choose two different nodes.');data.edges.push({source,target,type,relationshipClass,notes});selectedEdgeIdx=data.edges.length-1;saveData();rebuild()}
function saveEditedEdge(idx){const source=val('eFrom'),target=val('eTo'),relationshipClass=val('eClass')||'capability_inheritance',type=val('eType').trim()||'related to',notes=val('eNotes').trim();if(source===target)return alert('Choose two different nodes.');if(!data.edges[idx])return;data.edges[idx]={source,target,type,relationshipClass,notes};selectedId=source;selectedEdgeIdx=idx;saveData();rebuild()}
function deleteEdge(idx){const e=data.edges[idx];if(!e)return;if(!confirm('Delete this relationship?'))return;const keepNode=selectedId;data.edges.splice(idx,1);selectedEdgeIdx=null;selectedId=keepNode;saveData();rebuild()}
function deleteNode(id){const n=data.nodes.find(x=>x.id===id);if(!n)return;const connected=data.edges.filter(e=>e.source===id||e.target===id);const fallbackEdge=connected[0];const fallbackId=fallbackEdge?(fallbackEdge.source===id?fallbackEdge.target:fallbackEdge.source):null;const msg=`Delete “${n.name}”?\n\nThis will also delete ${connected.length} connected relationship${connected.length===1?'':'s'}. This cannot be undone unless you restore/import an earlier JSON export.`;if(!confirm(msg))return;data.edges=data.edges.filter(e=>e.source!==id&&e.target!==id);data.nodes=data.nodes.filter(x=>x.id!==id);selectedEdgeIdx=null;selectedId=(fallbackId&&data.nodes.some(x=>x.id===fallbackId))?fallbackId:(data.nodes[0]?.id||null);saveData();rebuild();if(!selectedId){setPanels('<div class="muted">Graph is empty. Add a node to continue.</div><div class="toolbar"><button onclick="showAddNode()">Add node</button></div>')}}

function val(id){const panels=[document.getElementById('mobilePanel'),document.getElementById('panel')];for(const p of panels){if(!p)continue;const el=p.querySelector('#'+id);if(el&&getComputedStyle(p).display!=='none')return el.value}for(const p of panels){const el=p?.querySelector('#'+id);if(el)return el.value}return ''}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='artist-centered-musical-intervention-graph-v0.6.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(ev){const f=ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!Array.isArray(x.nodes)||!Array.isArray(x.edges))throw Error();data=x;selectedId=data.nodes[0]?.id||null;selectedEdgeIdx=null;saveData();rebuild();alert('Imported.')}catch(e){alert('That file does not look like Music Graph JSON.')}};rd.readAsText(f)}
function resetSeed(){if(confirm('Replace local changes with the artist-centered v0.6 seed graph?')){data=clone(SEED);selectedId='system';selectedEdgeIdx=null;saveData();rebuild();resetView()}}
function resetView(){scale=1;offsetX=0;offsetY=0;for(const n of nodes){n.x=w/2+(Math.random()-.5)*250;n.y=h/2+(Math.random()-.5)*250;n.vx=n.vy=0}}
function openModal(){document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('drawerBtn').onclick=openModal;document.getElementById('closeModal').onclick=closeModal;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.getElementById('resetBtn').onclick=resetView;
document.getElementById('search').addEventListener('input',e=>{searchText=e.target.value.trim().toLowerCase();const exact=nodes.find(visible);if(searchText&&exact){selectedId=exact.id;renderPanel()}});document.getElementById('typeFilter').addEventListener('change',e=>{filterType=e.target.value});
function short(s,n){return s.length>n?s.slice(0,n-1)+'…':s}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function attr(s){return esc(s).replace(/`/g,'&#96;')}
window.addEventListener('resize',resize);resize();rebuild();resetView();tick();
</script>
</body>
</html>
