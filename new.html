const SEED = {
  nodes: [
    {id:"system",name:"Musical Intervention Chain",type:"system",notes:"A causal map of how musicians inherit a system, encounter a problem or opportunity, intervene in its components, and add a new musical capacity. The graph is not a single relay race: branches coexist, cross, and recombine."},

    {id:"era_renaissance",name:"Renaissance: architecture, rhetoric & space",type:"period",notes:"c. 1450–1600\nDominant inheritance: chant, medieval polyphony, modal organization, sacred and secular song, court and church institutions.\nCumulative capacities: unified polyphonic architecture, autonomous fabric, intelligible rhetoric, regulated clarity, and spatialized sound."},
    {id:"era_baroque",name:"Baroque: tonal direction & drama",type:"period",notes:"c. 1600–1750\nDominant inheritance: Renaissance counterpoint, monody, basso continuo, dance, emerging major-minor tonality.\nCumulative capacities: goal-directed harmony, instrumental narrative, formal contrast, integrated counterpoint, and public musical drama."},
    {id:"era_classical",name:"Classical: form as argument",type:"period",notes:"c. 1730–1820\nDominant inheritance: tonal syntax, instrumental genres, public concerts, galant clarity.\nCumulative capacities: conversational gesture, motivic reasoning, dramatic characterization, and transformative form."},
    {id:"era_romantic",name:"Romantic: interior & imagined worlds",type:"period",notes:"c. 1810–1910\nDominant inheritance: Classical form, public concert culture, expanding instruments, literary Romanticism.\nCumulative capacities: interiority, virtuoso identity, programmatic narrative, orchestral world-building, historical memory, timbral form, and plural totality."},
    {id:"era_black_atlantic",name:"Black Atlantic: groove, improvisation & participation",type:"tradition",notes:"18th–20th centuries, with older African inheritances\nWest and Central African rhythmic, vocal, and participatory practices interact under slavery and segregation with Christian hymnody, European instruments, oral traditions, migration, and commerce.\nThis is not a side branch: it becomes a primary engine of modern music."},
    {id:"era_modernism",name:"Modernisms: grammar decomposed",type:"period",notes:"c. 1900–1970\nThe late-Romantic system is no longer treated as the only available authority. Rhythm, dissonance, timbre, space, process, chance, and recorded sound become independently organizable."},
    {id:"era_recording",name:"Recording: performance becomes an object",type:"technology",notes:"1877 onward\nThe particular performance becomes durable and reproducible. Artist, performer, engineer, label, medium, and listener now help determine the musical work."},
    {id:"era_film",name:"Film: music becomes narrative infrastructure",type:"medium",notes:"1920s onward\nLate-Romantic, modernist, electronic, and popular capacities migrate into synchronized visual storytelling. Music can connect edits, establish worlds, expose psychology, and regulate scale and time."},
    {id:"era_studio",name:"Studio & electronic: sound becomes constructible",type:"technology",notes:"1940s onward\nTape, multitrack recording, synthesis, effects, and the mixing console detach music from a single performable event. Composition can occur inside the medium."},
    {id:"era_digital",name:"DJ & digital: everything becomes editable",type:"technology",notes:"1970s onward\nPlayback becomes performance; recorded history becomes raw material; software turns timing, pitch, timbre, arrangement, and form into editable data."},
    {id:"era_network",name:"Network & generative era",type:"period",notes:"2000s–today\nThe entire recorded past becomes simultaneously accessible. Distribution, recommendation, global collaboration, software, and generative systems alter what artists make and what audiences can find."},

    {id:"dufay",name:"Dufay: combine the available worlds",type:"artist",notes:"c. 1400–1474\nInherited: chant, medieval polyphony, French song, English consonance, court and chapel culture.\nProblem: unify large sacred structures without losing melodic character.\nIntervention: combines cyclic construction, learned counterpoint, consonant sonority, and secular melodic material.\nNew capacity: polyphony can become coherent architecture with recognizable melodic identity.\nListen: Se la face ay pale and the related Mass."},
    {id:"ockeghem",name:"Ockeghem: autonomous polyphonic fabric",type:"artist",notes:"c. 1410–1497\nInherited: cyclic Mass, cantus firmus, increasingly equal voices.\nProblem: what if music no longer sounds like a tune with decoration?\nIntervention: deep vocal independence, registral depth, obscured joints, canon.\nNew capacity: polyphony becomes a continuous self-generating environment.\nListen: Requiem, Introit."},
    {id:"josquin",name:"Josquin: architecture becomes rhetoric",type:"artist",notes:"c. 1450–1521\nInherited: continuous counterpoint, canon, sacred and secular song, Italian verbal expression.\nProblem: dense polyphony can hide words and blur structure.\nIntervention: compact motives, paired voices, imitation, text-sensitive texture changes.\nNew capacity: polyphony can behave like intelligible conversation and argument.\nListen: Ave Maria … virgo serena."},
    {id:"palestrina",name:"Palestrina: complexity under clarity",type:"artist",notes:"c. 1525–1594\nInherited: mature imitative counterpoint and Roman liturgy.\nProblem: retain richness without overwhelming sacred text or function.\nIntervention: controlled dissonance, smooth lines, staggered imitation, coordinated declamation.\nNew capacity: complexity and clarity can coexist in equilibrium.\nListen: Missa Papae Marcelli, Gloria."},
    {id:"gabrieli",name:"Gabrieli: architecture becomes an instrument",type:"artist",notes:"c. 1554–1612\nInherited: vocal polyphony, Venetian split choirs, instrumental ceremony, St. Mark's acoustics.\nProblem: what if sound sources occupy different physical locations?\nIntervention: separated ensembles, antiphonal exchange, instrumental contrast, sonorous blocks.\nNew capacity: music can organize physical space.\nListen: Canzon septimi toni or In ecclesiis."},
    {id:"monteverdi",name:"Monteverdi: reverse the hierarchy",type:"artist",notes:"1567–1643\nInherited: perfected counterpoint, expressive madrigal, monody, court theater.\nProblem: contrapuntal correctness can weaken words, character, and dramatic action.\nIntervention: text governs dissonance; solo voice, continuo, recitative, instrumental color, and recurrence center the character.\nNew capacity: music can sustain embodied drama in real time.\nListen: Cruda Amarilli and L'Orfeo."},

    {id:"corelli",name:"Corelli: instrumental tonal speech",type:"artist",notes:"1653–1713\nInherited: counterpoint, dance, basso continuo, violin technique, emerging tonality.\nProblem: how can instrumental music establish direction without words?\nIntervention: sequences, cadences, recurring harmonic patterns, idiomatic violin writing.\nNew capacity: instruments can narrate a journey through tonal space."},
    {id:"vivaldi",name:"Vivaldi: contrast becomes form",type:"artist",notes:"1678–1741\nInherited: Corelli's tonal syntax, concerto grosso, violin virtuosity.\nProblem: keep an extended instrumental work legible while displaying individuality.\nIntervention: recurring orchestral ritornellos alternate with exploratory solo episodes.\nNew capacity: repetition and contrast map large form; individual and collective become dramatic roles.\nListen: The Four Seasons."},
    {id:"bach",name:"J. S. Bach: integrate the inherited system",type:"artist",notes:"1685–1750\nInherited: Renaissance counterpoint, chorale, Italian concerto, French dance, organ traditions, tonal harmony.\nProblem: can all these systems operate simultaneously?\nIntervention: coordinates motive, line, harmony, dance, theology, and large form at multiple scales.\nNew capacity: maximum freedom can emerge from an intensely organized system.\nListen: Brandenburg Concertos, Well-Tempered Clavier, St Matthew Passion."},
    {id:"handel",name:"Handel: learned music enters the market",type:"artist",notes:"1685–1759\nInherited: Italian opera, German counterpoint, French ceremony, English choral practice, commercial theater.\nProblem: sustain large musical drama for a paying urban public.\nIntervention: memorable melody, theatrical character, direct rhetoric, adaptable opera and oratorio formats.\nNew capacity: large-scale learned music becomes public commercial entertainment.\nListen: Messiah or Giulio Cesare."},

    {id:"galant",name:"C. P. E. Bach & galant style: audible gesture",type:"movement",notes:"Mid-18th century\nInherited: late-Baroque density and tonal syntax.\nProblem: continuous counterpoint can suppress surprise and individual emotional volatility.\nIntervention: melody with accompaniment, clear phrases, abrupt changes of mood, register, and dynamics.\nNew capacity: music can sound like speech—question, answer, interruption, hesitation, exclamation."},
    {id:"haydn",name:"Haydn: form becomes reasoning",type:"artist",notes:"1732–1809\nInherited: clear phrases, tonal contrast, symphony, quartet, motivic development.\nProblem: sustain long instrumental meaning without text or ritornello.\nIntervention: small ideas are fragmented, redirected, delayed, recombined, and returned; expectation becomes material.\nNew capacity: form becomes audible argument.\nListen: Symphony No. 94 or Op. 76 quartets."},
    {id:"mozart",name:"Mozart: formal voices become persons",type:"artist",notes:"1756–1791\nInherited: Haydn's form, Italian melody, opera, orchestra, counterpoint.\nProblem: can formal elegance contain conflicting personalities and simultaneous truths?\nIntervention: operatic characterization enters ensembles and instrumental form.\nNew capacity: music can model social consciousness.\nListen: The Marriage of Figaro or Symphony No. 41."},
    {id:"beethoven",name:"Beethoven: form undergoes crisis",type:"artist",notes:"1770–1827\nInherited: Haydn's motivic reasoning, Mozart's drama, sonata practice, public concerts.\nProblem: can the work appear to struggle with and transform its own conditions?\nIntervention: radical motivic economy, rupture, dynamic conflict, long-range tension, transformative return.\nNew capacity: abstract form can carry psychological, moral, and historical experience.\nListen: Symphony No. 5 in full."},

    {id:"schubert",name:"Schubert: harmony opens interiority",type:"artist",notes:"1797–1828\nInherited: Classical form, domestic piano, German poetry, folk-like song.\nProblem: must meaning arise from dramatic conflict?\nIntervention: melody, repetition, harmonic displacement, and altered return suspend ordinary forward motion.\nNew capacity: returning to the same material can reveal a changed inner world.\nListen: Winterreise or String Quintet."},
    {id:"chopin",name:"Chopin: the piano becomes private space",type:"artist",notes:"1810–1849\nInherited: bel canto, salon, Polish dances, expanding piano technology, virtuosity.\nProblem: make virtuosity communicate intimacy rather than spectacle alone.\nIntervention: touch, pedal, ornament, rubato, texture, and national dance become inseparable from identity.\nNew capacity: instrumental technique becomes personal utterance."},
    {id:"berlioz",name:"Berlioz: timbre creates narrative",type:"artist",notes:"1803–1869\nInherited: Beethovenian symphony, opera, literary Romanticism, expanded orchestra.\nProblem: tell a psychological story without words.\nIntervention: idée fixe, radical orchestration, spatial effects, sharply differentiated episodes.\nNew capacity: recurring material can represent memory or obsession; color becomes structural.\nListen: Symphonie fantastique."},
    {id:"liszt",name:"Liszt: identity becomes transformation",type:"artist",notes:"1811–1886\nInherited: virtuoso spectacle, Beethovenian development, literary programs, recital culture.\nProblem: unify a long work without inherited multi-movement form.\nIntervention: one theme returns as march, lyric, threat, triumph, or memory; performer mythology enters reception.\nNew capacity: changing identity can organize form."},
    {id:"wagner",name:"Wagner: continuous dramatic world",type:"artist",notes:"1813–1883\nInherited: Beethoven, Berlioz, opera, myth, chromatic harmony.\nProblem: closed arias repeatedly stop dramatic time.\nIntervention: continuous music drama, leitmotif networks, expanded orchestra, prolonged chromatic suspension.\nNew capacity: music can represent memory, implication, desire, and what characters do not know.\nListen: Tristan und Isolde or the Ring cycle."},
    {id:"brahms",name:"Brahms: memory becomes generative",type:"artist",notes:"1833–1897\nInherited: Classical form, Bachian counterpoint, Beethovenian motive, Romantic harmony.\nProblem: does progress require destroying inherited forms?\nIntervention: developing variation continuously transforms small cells inside historical structures.\nNew capacity: tradition itself can generate novelty."},
    {id:"debussy",name:"Debussy: sound controls time",type:"artist",notes:"1862–1918\nInherited: Wagnerian chromaticism, French poetry, modes, orchestral color, non-European encounters.\nProblem: functional harmony constantly demands destination.\nIntervention: chords act as colors; mode, register, resonance, and timbre generate form.\nNew capacity: inhabiting a sonority can itself be the event.\nListen: Prélude à l'après-midi d'un faune or La mer."},
    {id:"mahler",name:"Mahler: symphony as contested world",type:"artist",notes:"1860–1911\nInherited: Beethovenian transformation, Wagnerian orchestra, song, folk and popular materials.\nProblem: can the symphony claim totality in a fractured modern culture?\nIntervention: marches, songs, fanfares, nature, vulgarity, irony, and metaphysics collide in enormous structures.\nNew capacity: a work can represent totality without pretending it is harmonious."},

    {id:"spirituals",name:"Spirituals & work songs: participatory survival",type:"tradition",notes:"18th–19th centuries\nInherited: African rhythmic, vocal, and participatory practices interacting with Christian hymnody and oral transmission.\nProblem: preserve identity, faith, memory, and coordination under violent cultural disruption.\nIntervention: call-and-response, repetition, layered participation, bodily rhythm, textual reinterpretation.\nNew capacity: the work can be a collectively recreated event rather than a fixed object."},
    {id:"gospel",name:"Black gospel: sacred intensity becomes embodied",type:"tradition",notes:"19th–20th centuries\nInherited: spirituals, hymnody, blues inflection, communal worship.\nProblem: make sacred testimony immediate, personal, and participatory.\nIntervention: improvisatory voice, call-and-response, rhythmic drive, repetition, and escalating collective intensity.\nNew capacity: individual expression and communal affirmation become one process."},
    {id:"blues",name:"Blues: individual truth in communal form",type:"tradition",notes:"Late 19th century onward\nInherited: work songs, spirituals, field hollers, ballads, string instruments, pitch inflection.\nProblem: articulate suffering, humor, desire, mobility, and selfhood in shareable form.\nIntervention: recurring harmonic and textual structures with flexible pitch, timing, grain, and response.\nNew capacity: identity can reside in delivery rather than formal uniqueness."},
    {id:"joplin",name:"Joplin & ragtime: rhythmic contradiction",type:"artist",notes:"Late 19th–early 20th centuries\nInherited: marches, piano music, African American dance rhythm, European harmony and notation.\nProblem: represent bodily rhythmic life inside a written metric grid.\nIntervention: persistent syncopation against a regular bass.\nNew capacity: tension between beat and attack becomes an organizing force."},
    {id:"armstrong",name:"Louis Armstrong: performance composes",type:"artist",notes:"1901–1971\nInherited: New Orleans ensemble jazz, blues, ragtime, brass bands, collective improvisation, recording.\nProblem: can one improvised line carry a performance's narrative?\nIntervention: swing, timbral identity, melodic transformation, rhythmic freedom, long-range solo construction.\nNew capacity: composition and performance partially merge."},
    {id:"ellington",name:"Duke Ellington: ensemble as community",type:"artist",notes:"1899–1974\nInherited: jazz improvisation, big band, written arrangement, blues, dance music.\nProblem: preserve individual identity inside a large ensemble.\nIntervention: composes for the particular timbres, ranges, techniques, and personalities of his musicians.\nNew capacity: an ensemble can be composed socially as well as acoustically."},

    {id:"stravinsky",name:"Stravinsky: rhythm & juxtaposition",type:"artist",notes:"1882–1971\nInherited: Russian folk materials, ballet, late-Romantic harmony, brilliant orchestration.\nProblem: what if time is driven by bodily force rather than harmonic arrival?\nIntervention: irregular accent, ostinato, layered patterns, repetition, abrupt blocks.\nNew capacity: rhythm becomes architecture; montage can replace continuous development.\nListen: The Rite of Spring."},
    {id:"schoenberg",name:"Schoenberg: remove tonal gravity",type:"artist",notes:"1874–1951\nInherited: Wagnerian chromaticism, Brahmsian motivic integration, late-Romantic expression.\nProblem: how can music remain coherent after key loses authority?\nIntervention: unresolved dissonance, atonality, then twelve-tone ordering.\nNew capacity: structure without a home key—at the cost of the listener's intuitive inherited map."},
    {id:"bartok",name:"Bartók: vernacular becomes structure",type:"artist",notes:"1881–1945\nInherited: modernism, field-collected regional traditions, Classical form.\nProblem: engage vernacular music without using it as picturesque decoration.\nIntervention: modal organization, asymmetrical rhythm, contour, and performance practice enter the mechanics of composition.\nNew capacity: cultural material can transform the system itself."},
    {id:"varese",name:"Varèse: compose masses of sound",type:"artist",notes:"1883–1965\nInherited: expanded orchestra, Debussy's timbre, Stravinsky's rhythm, industrial noise, electronics.\nProblem: why must composition begin with notes and melodies?\nIntervention: organizes density, register, attack, spatial motion, and colliding sound masses.\nNew capacity: sound itself—not only pitch—becomes the object of composition."},
    {id:"cage",name:"Cage: composition frames attention",type:"artist",notes:"1912–1992\nInherited: percussion, electronic sound, chance, modernist attacks on convention.\nProblem: does total authorial control prevent listeners from hearing the world?\nIntervention: chance, indeterminacy, silence, environment, unconventional instruments.\nNew capacity: listening and framing become artistic materials.\nListen: 4′33″ or Sonatas and Interludes."},
    {id:"electroacoustic",name:"Schaeffer, Henry & Stockhausen: loudspeaker instrument",type:"movement",notes:"1940s–1960s\nInherited: radio, recording, tape, acoustics, electronic tone generation.\nProblem: what if sound is detached from source and physical performer?\nIntervention: cut, reverse, layer, repeat, synthesize, and spatialize recorded sound.\nNew capacity: music need not be physically performable; composition occurs inside the medium."},
    {id:"minimalism",name:"Riley, Reich & Glass: audible process",type:"movement",notes:"1960s onward\nInherited: tape loops, jazz, non-Western rhythmic practices, electronics, serial modernism, tonality.\nProblem: complex organization has become perceptually opaque.\nIntervention: pulse, repetition, phase, additive process, incremental change.\nNew capacity: development through accumulation rather than conflict; perception changes while material remains nearly constant."},
    {id:"part",name:"Arvo Pärt: reduction reconstructs meaning",type:"artist",notes:"1970s onward\nInherited: serialism, chant, medieval sacred music, tonal resonance.\nProblem: recover significance after complexity has expanded almost without limit.\nIntervention: tintinnabuli binds scalar motion to triadic tones under severe constraints.\nNew capacity: simplicity becomes structurally intentional rather than merely nostalgic."},

    {id:"phonograph",name:"Phonograph: fix the event",type:"technology",notes:"1877 onward\nInherited: performance, score, memory, oral practice.\nProblem/opportunity: preserve and reproduce a particular sonic event.\nIntervention: mechanically, then electrically, inscribe sound for playback.\nNew capacity: the performance itself becomes a durable work."},
    {id:"genre_market",name:"Record industry: package genre",type:"institution",notes:"Early 20th century onward\nInherited: overlapping regional, racial, sacred, secular, and commercial practices.\nProblem: classify and sell recordings to mass markets.\nIntervention: labels, formats, charts, radio categories, and racialized marketing divide a continuous ecosystem into genres.\nNew capacity/constraint: traditions gain national visibility while commercial categories reshape what artists are allowed to be."},
    {id:"microphone",name:"Microphone: enlarge small gestures",type:"technology",notes:"1920s onward\nInherited: acoustic recording and projection-based singing.\nProblem: capture detail without requiring hall-filling physical volume.\nIntervention: electrical recording amplifies breath, softness, proximity, and nuance.\nNew capacity: mass communication can feel privately addressed."},
    {id:"intimate_singers",name:"Holiday, Crosby & Sinatra: recorded intimacy",type:"artist group",notes:"1930s–1950s\nInherited: popular song, jazz phrasing, microphone technology.\nProblem: how should a voice behave when projection is no longer the main constraint?\nIntervention: conversational phrasing, breath, delayed attack, softness, and minute timing.\nNew capacity: the singer can address millions as though speaking to one listener."},
    {id:"electric_rock",name:"Electric blues & rock and roll: amplified identity",type:"movement",notes:"1940s–1950s\nInherited: blues, gospel, country, folk, R&B, amplification, radio.\nProblem: address an urban, mobile, youthful mass public.\nIntervention: electric timbre, backbeat, concise song, vocal intensity, and performer identity.\nNew capacity: distortion, attack, amplification, and physical sound matter as much as notes.\nKey figures include Sister Rosetta Tharpe, Muddy Waters, Chuck Berry, and Little Richard."},
    {id:"james_brown",name:"James Brown: groove becomes architecture",type:"artist",notes:"1933–2006\nInherited: gospel, R&B, jazz horns, blues, amplified rhythm section.\nProblem: how little harmonic change is needed if rhythm is powerful enough?\nIntervention: downbeat emphasis, repeating riffs, vocal cues, interlocking parts, every instrument treated percussively.\nNew capacity: tracks develop through density, subdivision, layer, and placement rather than chord progression."},
    {id:"studio_pop",name:"Beatles, Martin & Wilson: studio composition",type:"artist group",notes:"1960s\nInherited: rock and roll, multitrack recording, orchestration, tape effects, LP format.\nProblem: why should recording merely document a live performance?\nIntervention: layering, editing, speed change, reversed sound, artificial space, unusual combinations.\nNew capacity: the recording becomes the original; live performance becomes an adaptation."},
    {id:"hendrix",name:"Hendrix: electricity becomes substance",type:"artist",notes:"1942–1970\nInherited: electric blues, rock guitar, amplification, studio experiment.\nProblem: can feedback, distortion, sustain, and stereo instability become controlled gestures?\nIntervention: integrates body, guitar, amplifier, effects, room, and recording.\nNew capacity: performer, instrument, electricity, and studio form one expressive system."},

    {id:"korngold",name:"Korngold: Romanticism migrates to cinema",type:"artist",notes:"1897–1957\nInherited: Wagnerian leitmotif, late-Romantic orchestra, opera, synchronized image.\nProblem: give emotional continuity to rapidly edited visual narrative.\nIntervention: themes, harmony, color, and timing align with character and action.\nNew capacity: music supplies the invisible continuity of a visual world."},
    {id:"herrmann",name:"Herrmann: score enters the mind",type:"artist",notes:"1911–1975\nInherited: symphonic scoring, modern harmony, radio drama, unusual timbre, psychological cinema.\nProblem: must music describe the visible world?\nIntervention: restricted motives, obsession, dissonance, unusual ensembles, timbral pressure.\nNew capacity: the score becomes subjective psychology rather than annotation."},
    {id:"williams",name:"John Williams: symphonic myth for mass culture",type:"artist",notes:"1932–\nInherited: leitmotif, tonal clarity, Korngold-style symphonism, modern cinema.\nProblem: make complex fictional worlds immediately coherent and memorable.\nIntervention: recurring thematic identities, orchestral spectacle, clear transformation across narrative.\nNew capacity: a franchise can possess a durable symbolic musical world."},
    {id:"zimmer",name:"Hans Zimmer: hybrid score as sonic system",type:"artist",notes:"1957–\nInherited: orchestra, electronics, minimalism, sound design, studio production.\nProblem: design scale, pressure, time, and interior space for contemporary cinema.\nIntervention: amplified bass, processed sound, repeating cells, orchestral-electronic fusion.\nNew capacity: the score becomes an engineered experiential system whose media cannot be cleanly separated."},

    {id:"dub",name:"Dub: mixing becomes performance",type:"movement",notes:"1960s–1970s onward\nInherited: Jamaican sound systems, reggae tracks, multitrack recording, instrumental versions.\nProblem: what else can an existing recording become after the song is complete?\nIntervention: remove parts, foreground bass and drums, manipulate echo, reverb, and the console live.\nNew capacity: absence, space, remix, and versioning become composition.\nKey figures: King Tubby and Lee 'Scratch' Perry."},
    {id:"kraftwerk_edm",name:"Kraftwerk, disco, house & techno: machine time",type:"movement",notes:"1970s–1990s\nInherited: electronics, minimalism, funk, disco, sequencers, drum machines, DJ practice.\nProblem: can machine regularity become bodily and emotional rather than imitative?\nIntervention: synthetic timbre, continuous pulse, extended mix, gradual layer change, dance-floor continuity.\nNew capacity: music functions as a continuous collective temporal environment."},
    {id:"eno",name:"Brian Eno: music designs attention",type:"artist",notes:"1970s onward\nInherited: tape, minimalism, electronic studio, rock production, experimental art.\nProblem: must music dominate attention or tell a foreground story?\nIntervention: ambient texture, slow process, studio systems, generative constraints.\nNew capacity: music can shape an environment while remaining compatible with multiple levels of attention."},

    {id:"hiphop",name:"Hip-hop: recorded history becomes an instrument",type:"movement",notes:"1970s onward\nInherited: funk breaks, Jamaican sound systems, spoken competition, disco, turntables, record collections.\nProblem: create new music without conventional institutional access but with playback equipment and records.\nIntervention: extend breaks, organize rhythmic speech, perform with turntables, sample and recombine recordings.\nNew capacity: listening becomes composition; the actual sonic past becomes present raw material."},
    {id:"daw",name:"Digital audio workstation: nonlinear production",type:"technology",notes:"1980s onward\nInherited: multitrack tape, synthesis, sampling, MIDI, studio editing.\nProblem: represent the whole studio as manipulable data.\nIntervention: move, repeat, correct, quantize, layer, synthesize, automate, and revise indefinitely.\nNew capacity: one person can compose, perform, record, edit, mix, and distribute an entire sonic world."},
    {id:"autotune",name:"Auto-Tune & vocal processing: mediation as style",type:"technology",notes:"Late 1990s onward\nInherited: pitch correction, digital editing, pop and R&B vocal practice.\nProblem: must technology disappear behind an apparently natural performance?\nIntervention: audible pitch correction, formant change, layering, and digital effects become timbre.\nNew capacity: the expressive voice may be an intentional body-software hybrid."},

    {id:"streaming",name:"Streaming: access replaces possession",type:"infrastructure",notes:"2000s onward\nInherited: MP3s, downloads, portable libraries, recommendation systems, internet distribution.\nProblem: organize access when the recorded archive becomes effectively limitless.\nIntervention: catalog, playlist, recommendation, skipping, metrics, and subscription replace individual ownership.\nNew capacity/constraint: global immediate access, but music now competes inside attention and classification systems."},
    {id:"global_production",name:"Global production: place becomes portable",type:"movement",notes:"21st century\nInherited: locally rooted rhythm, language, performance, shared software, global distribution.\nProblem: enter global circulation without abandoning local identity.\nIntervention: reggaeton, Afrobeats, K-pop, hip-hop, electronic, country, film, ambient, and other systems recombine inside common production networks.\nNew capacity/constraint: more worlds become audible, while shared tools and platforms can also homogenize them."},
    {id:"generative_ai",name:"Generative AI: execution becomes delegable",type:"technology",notes:"2020s–today\nInherited: algorithmic composition, DAWs, archives, style models, statistical generation.\nProblem/opportunity: produce usable musical material from higher-level direction.\nIntervention: systems generate melodies, arrangements, voices, textures, and mixes; humans prompt, select, edit, constrain, and contextualize.\nPotential capacity: execution separates further from authorship, making intention, selection, provenance, and meaning more important."},
    {id:"current_problem",name:"Current artistic problem: choose meaningful constraints",type:"concept",notes:"Today the artist inherits almost every earlier capacity at once.\nThe central problem is no longer gaining access to a single musical grammar. It is deciding which constraints to choose, which inheritances to activate, and what human purpose makes the result worth attention.\nScarce resources increasingly include coherence, identity, risk, context, and reasons to care."}

const palette=['#8fb5ff','#8fd9b6','#d5a6ff','#ffc98f','#ff9da5','#94d8ff','#c9d58f','#e7b8ff','#b1b7c4','#ffd98f','#9de0d0'];
function clone(x){return JSON.parse(JSON.stringify(x))}
function loadData(){try{const x=localStorage.getItem(KEY);return x?JSON.parse(x):clone(SEED)}catch(e){return clone(SEED)}}
function saveData(){localStorage.setItem(KEY,JSON.stringify(data));document.querySelectorAll('.status').forEach(x=>x.textContent='Saved locally on this device.')} 
function colorFor(type){let hash=0;for(const c of type)hash=(hash*31+c.charCodeAt(0))>>>0;return palette[hash%palette.length]}
function rebuild(){
  const old=new Map(nodes.map(n=>[n.id,n]));
  nodes=data.nodes.map((n,i)=>Object.assign({},n, old.get(n.id)||{x:w/2+(Math.random()-.5)*200,y:h/2+(Math.random()-.5)*200,vx:0,vy:0}, {r:n.type==='system'?20:n.type==='period'?16:n.type==='tradition'?14:n.type==='technology'?14:11}));
  const map=new Map(nodes.map(n=>[n.id,n])); edges=data.edges.map((e,dataIndex)=>Object.assign({},e,{dataIndex,a:map.get(e.source),b:map.get(e.target)})).filter(e=>e.a&&e.b);
  populateTypes(); renderPanel();
}
function populateTypes(){const sel=document.getElementById('typeFilter'), val=sel.value; const types=[...new Set(data.nodes.map(n=>n.type))].sort();sel.innerHTML='<option value="">All types</option>'+types.map(t=>`<option>${esc(t)}</option>`).join('');sel.value=val}
function visible(n){return (!filterType||n.type===filterType)&&(!searchText||n.name.toLowerCase().includes(searchText)||n.type.toLowerCase().includes(searchText)||(n.notes||'').toLowerCase().includes(searchText))}
function neighborSet(id){const s=new Set([id]);for(const e of edges){if(e.source===id)s.add(e.target);if(e.target===id)s.add(e.source)}return s}
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);w=r.width;h=r.height;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
function simulate(){
  const vis=nodes.filter(visible); const vset=new Set(vis.map(n=>n.id));
  for(let i=0;i<vis.length;i++)for(let j=i+1;j<vis.length;j++){const a=vis[i],b=vis[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy+0.1,dist=Math.sqrt(d2),force=Math.min(1.4,1300/d2);a.vx-=dx/dist*force;b.vx+=dx/dist*force;a.vy-=dy/dist*force;b.vy+=dy/dist*force}
  for(const e of edges){if(!vset.has(e.source)||!vset.has(e.target))continue;const a=e.a,b=e.b,dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy)+.01,target=90,force=(dist-target)*.004;a.vx+=dx/dist*force;b.vx-=dx/dist*force;a.vy+=dy/dist*force;b.vy-=dy/dist*force}
  for(const n of vis){n.vx+=(w/2-n.x)*.00015;n.vy+=(h/2-n.y)*.00015;if(n!==dragNode){n.vx*=.88;n.vy*=.88;n.x+=n.vx;n.y+=n.vy}}
}
function worldToScreen(n){return {x:n.x*scale+offsetX,y:n.y*scale+offsetY}}
function screenToWorld(x,y){return{x:(x-offsetX)/scale,y:(y-offsetY)/scale}}
function draw(){ctx.clearRect(0,0,w,h);if(w>20&&h>20){const fb=document.getElementById('fallbackGraph'),pn=document.getElementById('previewNote');if(fb)fb.style.display='none';if(pn)pn.style.display='none';}const vis=nodes.filter(visible),vset=new Set(vis.map(n=>n.id)),focus=selectedId?neighborSet(selectedId):null;
  ctx.lineWidth=1; for(let i=0;i<edges.length;i++){const e=edges[i];if(!vset.has(e.source)||!vset.has(e.target))continue;const a=worldToScreen(e.a),b=worldToScreen(e.b),chosen=e.dataIndex===selectedEdgeIdx,hot=chosen||(focus&&focus.has(e.source)&&focus.has(e.target));ctx.strokeStyle=chosen?'rgba(255,217,143,.95)':hot?'rgba(190,211,255,.72)':'rgba(120,130,150,.22)';ctx.lineWidth=chosen?4:hot?1.8:1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
  for(const n of vis){const p=worldToScreen(n),hot=selectedId===n.id,near=focus&&focus.has(n.id),dim=focus&&!near;ctx.globalAlpha=dim?.22:1;ctx.fillStyle=colorFor(n.type);ctx.beginPath();ctx.arc(p.x,p.y,n.r*(hot?1.18:1),0,Math.PI*2);ctx.fill();if(hot){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()} if(scale>.62||hot||n===nodes.find(x=>x.id===hoveredId)){ctx.fillStyle='#eef1f5';ctx.font=(hot?'600 ':'')+'12px -apple-system,BlinkMacSystemFont,sans-serif';ctx.textAlign='center';ctx.fillText(short(n.name,29),p.x,p.y+n.r+15)}ctx.globalAlpha=1}
}
function tick(){simulate();draw();requestAnimationFrame(tick)}
function hit(x,y){let best=null,bd=Infinity;for(const n of nodes.filter(visible)){const p=worldToScreen(n),d=Math.hypot(p.x-x,p.y-y);if(d<n.r+10&&d<bd){best=n;bd=d}}return best}
function hitEdge(x,y){const vis=new Set(nodes.filter(visible).map(n=>n.id));let best=null,bd=Infinity;for(const e of edges){if(!vis.has(e.source)||!vis.has(e.target))continue;const a=worldToScreen(e.a),b=worldToScreen(e.b),dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy;if(!l2)continue;let t=((x-a.x)*dx+(y-a.y)*dy)/l2;t=Math.max(0,Math.min(1,t));const px=a.x+t*dx,py=a.y+t*dy,d=Math.hypot(x-px,y-py);if(d<10&&d<bd){best=e;bd=d}}return best}
function pointerPos(ev){const r=canvas.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const p=pointerPos(e),n=hit(p.x,p.y);moved=false;lastX=p.x;lastY=p.y;if(n){dragNode=n;const q=screenToWorld(p.x,p.y);n.x=q.x;n.y=q.y}else panning=true});
canvas.addEventListener('pointermove',e=>{const p=pointerPos(e);hoveredId=hit(p.x,p.y)?.id||null;if(Math.hypot(p.x-lastX,p.y-lastY)>3)moved=true;if(dragNode){const q=screenToWorld(p.x,p.y);dragNode.x=q.x;dragNode.y=q.y;dragNode.vx=dragNode.vy=0}else if(panning){offsetX+=p.x-lastX;offsetY+=p.y-lastY}lastX=p.x;lastY=p.y});
canvas.addEventListener('pointerup',e=>{const p=pointerPos(e);if(!moved){const n=hit(p.x,p.y);if(n){selectedId=n.id;selectedEdgeIdx=null;renderPanel();if(innerWidth<761)openModal()}else{const edge=hitEdge(p.x,p.y);if(edge){selectedEdgeIdx=edge.dataIndex;showEditEdge(edge.dataIndex);if(innerWidth<761)openModal()}}}dragNode=null;panning=false});
canvas.addEventListener('wheel',e=>{e.preventDefault();const p=pointerPos(e),before=screenToWorld(p.x,p.y),factor=Math.exp(-e.deltaY*.001);scale=Math.max(.25,Math.min(3.5,scale*factor));offsetX=p.x-before.x*scale;offsetY=p.y-before.y*scale},{passive:false});
let touches=new Map(), pinchDist=0;
canvas.addEventListener('pointerdown',e=>{touches.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(touches.size===2){const a=[...touches.values()];pinchDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});
canvas.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2){const a=[...touches.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinchDist){scale=Math.max(.25,Math.min(3.5,scale*(d/pinchDist)))}pinchDist=d}});
canvas.addEventListener('pointerup',e=>touches.delete(e.pointerId));canvas.addEventListener('pointercancel',e=>touches.delete(e.pointerId));
function renderPanel(){const n=data.nodes.find(x=>x.id===selectedId)||data.nodes[0];if(!n)return;const related=data.edges.map((e,idx)=>({e,idx})).filter(x=>x.e.source===n.id||x.e.target===n.id).map(x=>{const e=x.e,out=e.source===n.id,other=data.nodes.find(y=>y.id===(out?e.target:e.source));return {idx:x.idx,dir:out?'→':'←',type:e.type,notes:e.notes||'',other}}).filter(x=>x.other);
 const html=`<div class="nodeTitle">${esc(n.name)}</div><div><span class="pill">${esc(n.type)}</span><span class="pill">${related.length} connection${related.length===1?'':'s'}</span></div><p class="muted nodeNotes">${esc(n.notes||'No notes yet.')}</p><div class="section"><h3>Connections</h3>${related.length?related.map(r=>`<div class="edge ${selectedEdgeIdx===r.idx?'edgeSelected':''}"><div class="edgeMain"><div class="edgeJump" data-jump="${esc(r.other.id)}"><b>${r.dir} ${esc(r.other.name)}</b><small>${esc(r.type)}${r.notes?' · '+esc(r.notes):''}</small></div><div class="edgeActions"><button onclick="showEditEdge(${r.idx});event.stopPropagation()">Edit</button><button class="danger" onclick="deleteEdge(${r.idx});event.stopPropagation()">Delete</button></div></div></div>`).join(''):'<div class="muted">No connections.</div>'}</div><div class="toolbar"><button onclick="showEditNode()">Edit node</button><button onclick="showAddNode()">Add node</button><button onclick="showAddEdge()">Add edge</button><button onclick="exportData()">Export JSON</button><button onclick="document.getElementById('importFile').click()">Import JSON</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"><button class="danger" onclick="resetSeed()">Restore seed</button></div><div class="status">Changes are stored in this browser using local storage.</div>`;
 document.getElementById('panel').innerHTML=html;document.getElementById('mobilePanel').innerHTML=html;document.querySelectorAll('[data-jump]').forEach(el=>el.onclick=()=>{selectedId=el.dataset.jump;selectedEdgeIdx=null;renderPanel()})}
function editForm(mode){const n=mode==='edit'?data.nodes.find(x=>x.id===selectedId):{id:'',name:'',type:'artist',notes:''};const del=mode==='edit'?`<button class="danger" onclick="deleteNode('${attr(n.id)}')">Delete node</button>`:'';return `<div class="form"><label>Name<input id="fName" value="${attr(n.name)}"></label><label>Type<input id="fType" value="${attr(n.type)}"></label><label>Notes<textarea id="fNotes">${esc(n.notes||'')}</textarea></label><button onclick="saveNode('${mode}')">Save</button>${del}<button onclick="renderPanel()">Cancel</button></div>`}
function showEditNode(){setPanels(editForm('edit'))} function showAddNode(){setPanels(editForm('add'))}
function edgeOptions(selected){return data.nodes.map(n=>`<option value="${attr(n.id)}" ${n.id===selected?'selected':''}>${esc(n.name)}</option>`).join('')}
function showAddEdge(){selectedEdgeIdx=null;setPanels(`<div class="form"><div class="nodeTitle">Add relationship</div><label>From<select id="eFrom">${edgeOptions(selectedId)}</select></label><label>Relationship<input id="eType" placeholder="e.g. develops into"></label><label>To<select id="eTo">${edgeOptions('')}</select></label><label>Notes<textarea id="eNotes"></textarea></label><button onclick="saveEdge()">Save edge</button><button onclick="renderPanel()">Cancel</button></div>`)}
function showEditEdge(idx){const e=data.edges[idx];if(!e)return;selectedEdgeIdx=idx;const a=data.nodes.find(n=>n.id===e.source),b=data.nodes.find(n=>n.id===e.target);setPanels(`<div class="form"><div class="nodeTitle">Edit relationship</div><div class="muted">${esc(a?.name||e.source)} → ${esc(b?.name||e.target)}</div><label>From<select id="eFrom">${edgeOptions(e.source)}</select></label><label>Relationship<input id="eType" value="${attr(e.type||'')}"></label><label>To<select id="eTo">${edgeOptions(e.target)}</select></label><label>Notes<textarea id="eNotes">${esc(e.notes||'')}</textarea></label><button onclick="saveEditedEdge(${idx})">Save changes</button><button class="danger" onclick="deleteEdge(${idx})">Delete relationship</button><button onclick="selectedEdgeIdx=null;renderPanel()">Cancel</button></div>`)}
function setPanels(html){document.getElementById('panel').innerHTML=html;document.getElementById('mobilePanel').innerHTML=html}
function slug(s){let base=s.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||'node',id=base,i=2;while(data.nodes.some(n=>n.id===id))id=base+'_'+i++;return id}
function saveNode(mode){const name=val('fName').trim(),type=val('fType').trim()||'unknown',notes=val('fNotes').trim();if(!name)return alert('Name is required.');if(mode==='edit'){const n=data.nodes.find(x=>x.id===selectedId);Object.assign(n,{name,type,notes})}else{const id=slug(name);data.nodes.push({id,name,type,notes});selectedId=id}saveData();rebuild()}
function saveEdge(){const source=val('eFrom'),target=val('eTo'),type=val('eType').trim()||'related to',notes=val('eNotes').trim();if(source===target)return alert('Choose two different nodes.');data.edges.push({source,target,type,notes});selectedEdgeIdx=data.edges.length-1;saveData();rebuild()}
function saveEditedEdge(idx){const source=val('eFrom'),target=val('eTo'),type=val('eType').trim()||'related to',notes=val('eNotes').trim();if(source===target)return alert('Choose two different nodes.');if(!data.edges[idx])return;data.edges[idx]={source,target,type,notes};selectedId=source;selectedEdgeIdx=idx;saveData();rebuild()}
function deleteEdge(idx){const e=data.edges[idx];if(!e)return;if(!confirm('Delete this relationship?'))return;const keepNode=selectedId;data.edges.splice(idx,1);selectedEdgeIdx=null;selectedId=keepNode;saveData();rebuild()}
function deleteNode(id){const n=data.nodes.find(x=>x.id===id);if(!n)return;const connected=data.edges.filter(e=>e.source===id||e.target===id);const fallbackEdge=connected[0];const fallbackId=fallbackEdge?(fallbackEdge.source===id?fallbackEdge.target:fallbackEdge.source):null;const msg=`Delete “${n.name}”?\n\nThis will also delete ${connected.length} connected relationship${connected.length===1?'':'s'}. This cannot be undone unless you restore/import an earlier JSON export.`;if(!confirm(msg))return;data.edges=data.edges.filter(e=>e.source!==id&&e.target!==id);data.nodes=data.nodes.filter(x=>x.id!==id);selectedEdgeIdx=null;selectedId=(fallbackId&&data.nodes.some(x=>x.id===fallbackId))?fallbackId:(data.nodes[0]?.id||null);saveData();rebuild();if(!selectedId){setPanels('<div class="muted">Graph is empty. Add a node to continue.</div><div class="toolbar"><button onclick="showAddNode()">Add node</button></div>')}}

function val(id){const panels=[document.getElementById('mobilePanel'),document.getElementById('panel')];for(const p of panels){if(!p)continue;const el=p.querySelector('#'+id);if(el&&getComputedStyle(p).display!=='none')return el.value}for(const p of panels){const el=p?.querySelector('#'+id);if(el)return el.value}return ''}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='musical-intervention-graph-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(ev){const f=ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!Array.isArray(x.nodes)||!Array.isArray(x.edges))throw Error();data=x;selectedId=data.nodes[0]?.id||null;selectedEdgeIdx=null;saveData();rebuild();alert('Imported.')}catch(e){alert('That file does not look like Music Graph JSON.')}};rd.readAsText(f)}
function resetSeed(){if(confirm('Replace local changes with the original musical-intervention seed graph?')){data=clone(SEED);selectedId='system';selectedEdgeIdx=null;saveData();rebuild();resetView()}}
function resetView(){scale=1;offsetX=0;offsetY=0;for(const n of nodes){n.x=w/2+(Math.random()-.5)*250;n.y=h/2+(Math.random()-.5)*250;n.vx=n.vy=0}}
function openModal(){document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('drawerBtn').onclick=openModal;document.getElementById('closeModal').onclick=closeModal;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.getElementById('resetBtn').onclick=resetView;
document.getElementById('search').addEventListener('input',e=>{searchText=e.target.value.trim().toLowerCase();const exact=nodes.find(n=>n.name.toLowerCase().includes(searchText)&&visible(n));if(searchText&&exact){selectedId=exact.id;renderPanel()}});document.getElementById('typeFilter').addEventListener('change',e=>{filterType=e.target.value});
function short(s,n){return s.length>n?s.slice(0,n-1)+'…':s}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function attr(s){return esc(s).replace(/`/g,'&#96;')}
window.addEventListener('resize',resize);resize();rebuild();resetView();tick();
</script>
</body>
</html>
