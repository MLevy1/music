function spatialTab(n,cs){const sp=n.spatial;if(!sp)return `<div class="card"><b>No spatial dimensions yet</b><div class="sub">Turn this graph node into a measured room, closet, furniture item, storage area, floor, or surface without changing its graph relationships.</div><div class="toolbar"><button onclick="showSpatialEditor('${n.id}')">Add spatial data</button><button onclick="previewDemo('${n.id}')">Use example dimensions</button></div></div>${childList(cs)}`;const unit=sp.unit||'cm',dim=sp.shape==='surface'?`${sp.width} × ${sp.depth} ${unit}`:`${sp.width} × ${sp.depth} × ${sp.height} ${unit}`,occ=sp.occupancy||'Empty',pct=Math.round((OCC[occ]??0)*100);return `<canvas id="spatialCanvas" class="spatialCanvas"></canvas><div class="metric"><div class="card"><small class="sub">Dimensions</small><b>${esc(dim)}</b></div><div class="card"><small class="sub">State</small><b>${esc(occ)}</b><div class="occupancy"><span style="width:${pct}%"></span></div></div></div><div class="legend"><span><i class="sw" style="background:${COLORS.Air}"></i>Air</span><span><i class="sw" style="background:${COLORS['Storage Area']}"></i>Storage</span><span><i class="sw" style="background:${COLORS.Surface}"></i>Surface</span><span><i class="sw" style="background:${COLORS.Floor}"></i>Floor</span><span><i class="sw" style="background:${COLORS.Furniture}"></i>Furniture</span></div><div class="toolbar"><button onclick="showSpatialEditor('${n.id}')">Edit dimensions</button><button onclick="showAddSpatialChild('${n.id}')">+ Spatial child</button><button class="danger" onclick="removeSpatial('${n.id}')">Remove spatial data</button></div>${childList(cs)}<div class="status">Spatial values are stored inside this node in the exported JSON.</div>`}

function toCm(v,u){return v*(u==='m'?100:u==='dm'?10:1)}function drawSpatial(n){const c=document.getElementById('spatialCanvas');if(!c||!n.spatial)return;const r=c.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1),x=c.getContext('2d');c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,r.width,r.height);const s=n.spatial,W=toCm(s.width,s.unit),D=toCm(s.depth,s.unit),H=s.shape==='surface'?0:toCm(s.height,s.unit),max=Math.max(W,D,H||1),k=Math.min(180/max,2.2),ww=W*k,dd=D*k*.48,hh=H*k*.78,cx=r.width/2,baseY=r.height*.72,dx=dd*.72,dy=dd*.42;const fill=color(n),alpha=.18+.55*(OCC[s.occupancy]??0);x.lineJoin='round';if(s.shape==='surface'){x.fillStyle=hexAlpha(fill,.55);x.strokeStyle='#e9eef7';x.beginPath();x.moveTo(cx-ww/2,baseY);x.lineTo(cx+ww/2,baseY);x.lineTo(cx+ww/2+dx,baseY-dy);x.lineTo(cx-ww/2+dx,baseY-dy);x.closePath();x.fill();x.stroke()}else{const A=[cx-ww/2,baseY],B=[cx+ww/2,baseY],C=[cx+ww/2+dx,baseY-dy],D0=[cx-ww/2+dx,baseY-dy],At=[A[0],A[1]-hh],Bt=[B[0],B[1]-hh],Ct=[C[0],C[1]-hh],Dt=[D0[0],D0[1]-hh];poly(x,[A,B,Bt,At],hexAlpha(fill,alpha),'#dfe6f2');poly(x,[B,C,Ct,Bt],hexAlpha(fill,Math.max(.12,alpha-.12)),'#dfe6f2');poly(x,[At,Bt,Ct,Dt],hexAlpha(fill,Math.min(.85,alpha+.12)),'#dfe6f2');x.strokeStyle='#dfe6f2';x.beginPath();x.moveTo(A[0],A[1]);x.lineTo(D0[0],D0[1]);x.lineTo(Dt[0],Dt[1]);x.lineTo(At[0],At[1]);x.stroke()}x.fillStyle='#eef1f5';x.font='12px sans-serif';x.textAlign='center';x.fillText(`${s.width} × ${s.depth}${s.shape==='surface'?'':' × '+s.height} ${s.unit}`,r.width/2,r.height-22);x.fillStyle='#9aa3af';x.fillText(`${s.category} · ${s.occupancy}`,r.width/2,r.height-7)}function poly(x,p,fill,stroke){x.fillStyle=fill;x.strokeStyle=stroke;x.beginPath();x.moveTo(...p[0]);for(let i=1;i<p.length;i++)x.lineTo(...p[i]);x.closePath();x.fill();x.stroke()}function hexAlpha(hex,a){if(!hex.startsWith('#'))return hex;let h=hex.slice(1);if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`}
function addNode(){const name=prompt('Node name');if(!name)return;const id=slug(name);data.nodes.push({id,name,type:'Node',subtitle:'',notes:'',tags:[],size:11,color:'',pinned:false,meta:{},x:w/2,y:h/2});selected=id;save();rebuild()}function exportData(){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='home-spatial-graph-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(file){const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.nodes)||!Array.isArray(d.edges))throw Error();data=d;selected=data.nodes[0]?.id||null;save('Imported.');rebuild()}catch(e){alert('Invalid graph JSON.')}};rd.readAsText(file)}
