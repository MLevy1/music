<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Flexible Graph v1.0</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#20242d;--text:#eef1f5;--muted:#9aa3af;--border:#2d3340;--accent:#8fb5ff;--danger:#ff8f8f;--ok:#8fd9b6}
*{box-sizing:border-box} body{margin:0;font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit} button{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;cursor:pointer} button:active{transform:translateY(1px)}
#app{display:grid;grid-template-rows:auto 1fr;height:100dvh}.topbar{display:flex;gap:8px;align-items:center;padding:10px max(10px,env(safe-area-inset-right)) 10px max(10px,env(safe-area-inset-left));border-bottom:1px solid var(--border);background:var(--panel);z-index:5}.brand{font-weight:700;white-space:nowrap}.search{flex:1;min-width:80px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 10px}.topbar select{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 8px;max-width:145px}
.main{display:grid;grid-template-columns:1fr 360px;min-height:0}.canvasWrap{position:relative;min-width:0;min-height:0}.canvasWrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.hint{position:absolute;left:10px;bottom:10px;background:#0f1115cc;border:1px solid var(--border);border-radius:9px;padding:7px 9px;color:var(--muted);font-size:12px;pointer-events:none}.panel{border-left:1px solid var(--border);background:var(--panel);padding:14px;overflow:auto}.muted{color:var(--muted)}.pill{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:3px 7px;margin:2px 3px 2px 0;font-size:12px;color:var(--muted)}.nodeTitle{font-size:22px;font-weight:700;margin:2px 0 4px}.section{margin-top:18px}.section h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}.edge{padding:9px 0;border-bottom:1px solid var(--border)}.edgeMain{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.edgeJump{min-width:0;flex:1;cursor:pointer}.edge b{display:block;font-weight:600}.edge small{color:var(--muted)}.edgeActions{display:flex;gap:5px;flex-shrink:0}.edgeActions button{padding:5px 7px;font-size:12px;border-radius:7px}.edgeSelected{background:#20242d;border-radius:8px;padding-left:7px;padding-right:7px}.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.status{font-size:12px;color:var(--muted);margin-top:8px}.form{display:grid;gap:8px}.form input,.form select,.form textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px}.form textarea{min-height:80px;resize:vertical}.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.danger{border-color:#6b3434}.ok{color:var(--ok)}.metaGrid{display:grid;gap:8px;margin-top:12px}.metaBlock{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px}.metaBlock h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 5px}.metaBlock p{margin:0;white-space:pre-line}.kv{display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:8px;border-bottom:1px solid var(--border);padding:6px 0}.kv:last-child{border-bottom:0}.kv b{font-size:12px;color:var(--muted)}
#drawerBtn{display:none}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{background:var(--panel);border-radius:18px 18px 0 0;width:100%;max-height:82dvh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}.sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sheetHead h2{margin:0;font-size:18px}.empty{display:grid;place-items:center;text-align:center;height:100%;min-height:260px;color:var(--muted);padding:25px}.empty strong{display:block;color:var(--text);font-size:20px;margin-bottom:8px}.empty .toolbar{justify-content:center}
@media(max-width:760px){.main{grid-template-columns:1fr}.panel{display:none}.brand{font-size:13px}.topbar select{max-width:110px}#drawerBtn{display:block}.topbar{gap:6px}.topbar button{padding:9px}.search{max-width:none}.form .row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">Flexible Graph v1.0</div>
    <input id="search" class="search" placeholder="Search everything…" autocomplete="off" />
    <select id="typeFilter"><option value="">All types</option></select>
    <button id="addTopBtn">+ Node</button>
    <button id="resetBtn" title="Reset view">Reset view</button>
    <button id="drawerBtn">Details</button>
  </div>
  <div class="main">
    <div class="canvasWrap"><canvas id="graph"></canvas><div class="hint">Tap node • drag node to position • drag background to pan • pinch/scroll to zoom</div></div>
    <aside id="panel" class="panel"></aside>
  </div>
</div>
<div id="modal" class="modal"><div class="sheet"><div class="sheetHead"><h2>Details</h2><button id="closeModal">Close</button></div><div id="mobilePanel"></div></div></div>
<script>
const SEED={schemaVersion:"1.0",model:"general flexible graph",nodes:[],edges:[]};
const KEY='flexibleGraphV10';
let data=loadData();
let selectedId=null,selectedEdgeIdx=null,hoveredId=null,filterType='',searchText='';
const canvas=document.getElementById('graph'),ctx=canvas.getContext('2d');
let dpr=1,w=0,h=0,scale=1,offsetX=0,offsetY=0,dragNode=null,panning=false,lastX=0,lastY=0,moved=false;
let nodes=[],edges=[];
const palette=['#8fb5ff','#8fd9b6','#d5a6ff','#ffc98f','#ff9da5','#94d8ff','#c9d58f','#e7b8ff','#b1b7c4','#ffd98f','#9de0d0','#f2a7c2'];
function clone(x){return JSON.parse(JSON.stringify(x))}
function loadData(){try{const x=localStorage.getItem(KEY);return x?JSON.parse(x):clone(SEED)}catch(e){return clone(SEED)}}
function saveData(msg='Saved locally on this device.'){localStorage.setItem(KEY,JSON.stringify(data));document.querySelectorAll('.status').forEach(x=>x.textContent=msg)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function attr(s){return esc(s).replace(/`/g,'&#96;')}
function val(id){for(const p of [document.getElementById('mobilePanel'),document.getElementById('panel')]){if(!p)continue;const el=p.querySelector('#'+id);if(el&&getComputedStyle(p).display!=='none')return el.value}for(const p of [document.getElementById('mobilePanel'),document.getElementById('panel')]){const el=p?.querySelector('#'+id);if(el)return el.value}return ''}
function slug(s){let base=s.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||'node',id=base,i=2;while(data.nodes.some(n=>n.id===id))id=base+'_'+i++;return id}
function colorForType(type){let hash=0;for(const c of String(type||'node'))hash=(hash*31+c.charCodeAt(0))>>>0;return palette[hash%palette.length]}
function parseJSON(text,label){if(!text.trim())return {};try{const x=JSON.parse(text);if(!x||Array.isArray(x)||typeof x!=='object')throw Error();return x}catch(e){throw new Error(label+' must be a valid JSON object.') }}
function rebuild(){
 const old=new Map(nodes.map(n=>[n.id,n]));
 nodes=data.nodes.map(n=>{const prev=old.get(n.id),pos=(Number.isFinite(n.x)&&Number.isFinite(n.y))?{x:n.x,y:n.y}:{x:w/2+(Math.random()-.5)*260,y:h/2+(Math.random()-.5)*260};return Object.assign({},n,prev||pos,{vx:prev?.vx||0,vy:prev?.vy||0,r:Math.max(7,Math.min(28,Number(n.size)||11))})});
 const map=new Map(nodes.map(n=>[n.id,n]));edges=data.edges.map((e,dataIndex)=>Object.assign({},e,{dataIndex,a:map.get(e.source),b:map.get(e.target)})).filter(e=>e.a&&e.b);
 if(selectedId&&!data.nodes.some(n=>n.id===selectedId))selectedId=data.nodes[0]?.id||null;
 populateTypes();renderPanel();
}
function populateTypes(){const sel=document.getElementById('typeFilter'),old=sel.value;const types=[...new Set(data.nodes.map(n=>n.type).filter(Boolean))].sort();sel.innerHTML='<option value="">All types</option>'+types.map(t=>`<option value="${attr(t)}">${esc(t)}</option>`).join('');sel.value=types.includes(old)?old:''}
function visible(n){return(!filterType||n.type===filterType)&&(!searchText||JSON.stringify(n).toLowerCase().includes(searchText))}
function neighborSet(id){const s=new Set([id]);for(const e of edges){if(e.source===id)s.add(e.target);if(e.target===id)s.add(e.source)}return s}
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);w=r.width;h=r.height;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
function simulate(){const vis=nodes.filter(visible),vset=new Set(vis.map(n=>n.id));for(let i=0;i<vis.length;i++)for(let j=i+1;j<vis.length;j++){const a=vis[i],b=vis[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy+.1,dist=Math.sqrt(d2),force=Math.min(1.5,1500/d2);a.vx-=dx/dist*force;b.vx+=dx/dist*force;a.vy-=dy/dist*force;b.vy+=dy/dist*force}for(const e of edges){if(!vset.has(e.source)||!vset.has(e.target))continue;const a=e.a,b=e.b,dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy)+.01,target=Number(e.length)||100,force=(dist-target)*.004;a.vx+=dx/dist*force;b.vx-=dx/dist*force;a.vy+=dy/dist*force;b.vy-=dy/dist*force}for(const n of vis){if(!n.pinned){n.vx+=(w/2-n.x)*.00012;n.vy+=(h/2-n.y)*.00012;if(n!==dragNode){n.vx*=.88;n.vy*=.88;n.x+=n.vx;n.y+=n.vy}}}}
function worldToScreen(n){return{x:n.x*scale+offsetX,y:n.y*scale+offsetY}}
function screenToWorld(x,y){return{x:(x-offsetX)/scale,y:(y-offsetY)/scale}}
function edgeColor(e,hot,chosen){if(chosen)return 'rgba(255,217,143,.95)';if(hot)return 'rgba(225,235,255,.78)';if(e.color)return e.color;let hash=0;for(const c of String(e.relationshipType||e.type||'relationship'))hash=(hash*31+c.charCodeAt(0))>>>0;const hex=palette[hash%palette.length];return hex+'66'}
function draw(){ctx.clearRect(0,0,w,h);const vis=nodes.filter(visible),vset=new Set(vis.map(n=>n.id)),focus=selectedId?neighborSet(selectedId):null;for(const e of edges){if(!vset.has(e.source)||!vset.has(e.target))continue;const a=worldToScreen(e.a),b=worldToScreen(e.b),chosen=e.dataIndex===selectedEdgeIdx,hot=chosen||(focus&&focus.has(e.source)&&focus.has(e.target));ctx.setLineDash(e.dashed?[7,5]:[]);ctx.strokeStyle=edgeColor(e,hot,chosen);ctx.lineWidth=chosen?4:hot?1.8:Math.max(.7,Math.min(5,Number(e.weight)||1));ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}ctx.setLineDash([]);for(const n of vis){const p=worldToScreen(n),hot=selectedId===n.id,near=focus&&focus.has(n.id),dim=focus&&!near;ctx.globalAlpha=dim?.22:1;ctx.fillStyle=n.color||colorForType(n.type);ctx.beginPath();ctx.arc(p.x,p.y,n.r*(hot?1.18:1),0,Math.PI*2);ctx.fill();if(hot){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}if(scale>.62||hot||n.id===hoveredId){ctx.fillStyle='#eef1f5';ctx.font=(hot?'600 ':'')+'12px -apple-system,BlinkMacSystemFont,sans-serif';ctx.textAlign='center';ctx.fillText(short(n.name,34),p.x,p.y+n.r+15)}ctx.globalAlpha=1}}
function tick(){simulate();draw();requestAnimationFrame(tick)}
function hit(x,y){let best=null,bd=Infinity;for(const n of nodes.filter(visible)){const p=worldToScreen(n),d=Math.hypot(p.x-x,p.y-y);if(d<n.r+10&&d<bd){best=n;bd=d}}return best}
function hitEdge(x,y){const vis=new Set(nodes.filter(visible).map(n=>n.id));let best=null,bd=Infinity;for(const e of edges){if(!vis.has(e.source)||!vis.has(e.target))continue;const a=worldToScreen(e.a),b=worldToScreen(e.b),dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy;if(!l2)continue;let t=((x-a.x)*dx+(y-a.y)*dy)/l2;t=Math.max(0,Math.min(1,t));const px=a.x+t*dx,py=a.y+t*dy,d=Math.hypot(x-px,y-py);if(d<10&&d<bd){best=e;bd=d}}return best}
function pointerPos(ev){const r=canvas.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const p=pointerPos(e),n=hit(p.x,p.y);moved=false;lastX=p.x;lastY=p.y;if(n){dragNode=n;const q=screenToWorld(p.x,p.y);n.x=q.x;n.y=q.y}else panning=true});
canvas.addEventListener('pointermove',e=>{const p=pointerPos(e);hoveredId=hit(p.x,p.y)?.id||null;if(Math.hypot(p.x-lastX,p.y-lastY)>3)moved=true;if(dragNode){const q=screenToWorld(p.x,p.y);dragNode.x=q.x;dragNode.y=q.y;dragNode.vx=dragNode.vy=0}else if(panning){offsetX+=p.x-lastX;offsetY+=p.y-lastY}lastX=p.x;lastY=p.y});
canvas.addEventListener('pointerup',e=>{const p=pointerPos(e);if(dragNode){const d=data.nodes.find(n=>n.id===dragNode.id);if(d){d.x=dragNode.x;d.y=dragNode.y;saveData('Position saved.')}}if(!moved){const n=hit(p.x,p.y);if(n){selectedId=n.id;selectedEdgeIdx=null;renderPanel();if(innerWidth<761)openModal()}else{const edge=hitEdge(p.x,p.y);if(edge){selectedEdgeIdx=edge.dataIndex;showEditEdge(edge.dataIndex);if(innerWidth<761)openModal()}}}dragNode=null;panning=false});
canvas.addEventListener('wheel',e=>{e.preventDefault();const p=pointerPos(e),before=screenToWorld(p.x,p.y),factor=Math.exp(-e.deltaY*.001);scale=Math.max(.25,Math.min(4,scale*factor));offsetX=p.x-before.x*scale;offsetY=p.y-before.y*scale},{passive:false});
let touches=new Map(),pinchDist=0;canvas.addEventListener('pointerdown',e=>{touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2){const a=[...touches.values()];pinchDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});canvas.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2){const a=[...touches.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinchDist)scale=Math.max(.25,Math.min(4,scale*(d/pinchDist)));pinchDist=d}});canvas.addEventListener('pointerup',e=>touches.delete(e.pointerId));canvas.addEventListener('pointercancel',e=>touches.delete(e.pointerId));
function metaHtml(obj){const entries=Object.entries(obj||{});if(!entries.length)return '';return `<div class="section"><h3>Custom metadata</h3><div class="metaBlock">${entries.map(([k,v])=>`<div class="kv"><b>${esc(k)}</b><span>${esc(typeof v==='object'?JSON.stringify(v):v)}</span></div>`).join('')}</div></div>`}
function renderEmpty(){const html=`<div class="empty"><div><strong>Blank graph</strong><div>Start with any kind of node. Types and relationships are completely free-form.</div><div class="toolbar"><button onclick="showAddNode()">Add first node</button><button onclick="document.getElementById('importFileEmpty').click()">Import JSON</button><input id="importFileEmpty" type="file" accept="application/json" hidden onchange="importData(event)"></div></div></div>`;setPanels(html)}
function renderPanel(){if(!data.nodes.length){renderEmpty();return}const n=data.nodes.find(x=>x.id===selectedId)||data.nodes[0];selectedId=n.id;const related=data.edges.map((e,idx)=>({e,idx})).filter(x=>x.e.source===n.id||x.e.target===n.id).map(x=>{const e=x.e,out=e.source===n.id,other=data.nodes.find(y=>y.id===(out?e.target:e.source));return{idx:x.idx,dir:out?'→':'←',other,e}}).filter(x=>x.other);const meta=[n.type,n.subtitle,n.pinned?'pinned':null,`${related.length} connection${related.length===1?'':'s'}`].filter(Boolean).map(x=>`<span class="pill">${esc(x)}</span>`).join('');const connections=`<div class="section"><h3>Connections</h3>${related.length?related.map(r=>`<div class="edge ${selectedEdgeIdx===r.idx?'edgeSelected':''}"><div class="edgeMain"><div class="edgeJump" data-jump="${attr(r.other.id)}"><b>${r.dir} ${esc(r.other.name)}</b><small>${r.e.relationshipType?`[${esc(r.e.relationshipType)}] `:''}${esc(r.e.type||'related to')}${r.e.notes?' · '+esc(r.e.notes):''}</small></div><div class="edgeActions"><button onclick="showEditEdge(${r.idx});event.stopPropagation()">Edit</button><button class="danger" onclick="deleteEdge(${r.idx});event.stopPropagation()">Delete</button></div></div></div>`).join(''):'<div class="muted">No connections.</div>'}</div>`;const tools=`<div class="toolbar"><button onclick="showEditNode()">Edit node</button><button onclick="duplicateNode()">Duplicate</button><button onclick="showAddNode()">Add node</button><button onclick="showAddEdge()">Add edge</button><button onclick="exportData()">Export JSON</button><button onclick="document.getElementById('importFile').click()">Import JSON</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"><button class="danger" onclick="clearGraph()">Clear graph</button></div><div class="status">Changes and dragged positions are stored locally in this browser.</div>`;const html=`<div class="nodeTitle">${esc(n.name)}</div><div>${meta}</div>${n.notes?`<div class="metaGrid"><div class="metaBlock"><h4>Notes</h4><p>${esc(n.notes)}</p></div></div>`:''}${n.tags?.length?`<div class="section"><h3>Tags</h3>${n.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div>`:''}${metaHtml(n.meta)}${connections}${tools}`;setPanels(html);document.querySelectorAll('[data-jump]').forEach(el=>el.onclick=()=>{selectedId=el.dataset.jump;selectedEdgeIdx=null;renderPanel()})}
function nodeForm(mode){const n=mode==='edit'?data.nodes.find(x=>x.id===selectedId):{name:'',type:'node',subtitle:'',notes:'',tags:[],meta:{},size:11,color:'',pinned:false};const del=mode==='edit'?`<button class="danger" onclick="deleteNode('${attr(n.id)}')">Delete node</button>`:'';return `<div class="form"><div class="nodeTitle">${mode==='edit'?'Edit node':'Add node'}</div><label>Name<input id="fName" value="${attr(n.name)}"></label><div class="row2"><label>Type<input id="fType" value="${attr(n.type||'node')}" placeholder="person, idea, project, event…"></label><label>Subtitle<input id="fSubtitle" value="${attr(n.subtitle||'')}" placeholder="optional"></label></div><label>Tags (comma separated)<input id="fTags" value="${attr((n.tags||[]).join(', '))}"></label><label>Notes<textarea id="fNotes">${esc(n.notes||'')}</textarea></label><div class="row2"><label>Node size<input id="fSize" type="number" min="7" max="28" value="${attr(n.size||11)}"></label><label>Node color<input id="fColor" value="${attr(n.color||'')}" placeholder="#8fb5ff (optional)"></label></div><label><input id="fPinned" type="checkbox" ${n.pinned?'checked':''} style="width:auto;margin-right:6px">Pin position / exclude from force movement</label><label>Custom metadata (JSON object)<textarea id="fMeta" spellcheck="false">${esc(JSON.stringify(n.meta||{},null,2))}</textarea></label><button onclick="saveNode('${mode}')">Save</button>${del}<button onclick="renderPanel()">Cancel</button></div>`}
function showEditNode(){setPanels(nodeForm('edit'))}function showAddNode(){setPanels(nodeForm('add'));if(innerWidth<761)openModal()}
function saveNode(mode){try{const name=val('fName').trim(),type=val('fType').trim()||'node',subtitle=val('fSubtitle').trim(),notes=val('fNotes').trim(),tags=val('fTags').split(',').map(x=>x.trim()).filter(Boolean),size=Math.max(7,Math.min(28,Number(val('fSize'))||11)),color=val('fColor').trim(),meta=parseJSON(val('fMeta'),'Custom metadata');const panel=(getComputedStyle(document.getElementById('panel')).display!=='none'?document.getElementById('panel'):document.getElementById('mobilePanel'));const pinned=!!panel.querySelector('#fPinned')?.checked;if(!name)return alert('Name is required.');if(mode==='edit'){const n=data.nodes.find(x=>x.id===selectedId);Object.assign(n,{name,type,subtitle,notes,tags,size,color,pinned,meta})}else{const id=slug(name),q=screenToWorld(w/2,h/2);data.nodes.push({id,name,type,subtitle,notes,tags,size,color,pinned,meta,x:q.x+(Math.random()-.5)*50,y:q.y+(Math.random()-.5)*50});selectedId=id}saveData();rebuild()}catch(e){alert(e.message)}}
function duplicateNode(){const n=data.nodes.find(x=>x.id===selectedId);if(!n)return;const copy=clone(n);copy.id=slug(n.name+' copy');copy.name=n.name+' copy';copy.x=(n.x||0)+35;copy.y=(n.y||0)+35;data.nodes.push(copy);selectedId=copy.id;saveData();rebuild()}
function edgeOptions(selected){return data.nodes.map(n=>`<option value="${attr(n.id)}" ${n.id===selected?'selected':''}>${esc(n.name)}</option>`).join('')}
function showAddEdge(){if(data.nodes.length<2)return alert('Add at least two nodes first.');selectedEdgeIdx=null;const defaultTo=data.nodes.find(n=>n.id!==selectedId)?.id||'';setPanels(`<div class="form"><div class="nodeTitle">Add relationship</div><label>From<select id="eFrom">${edgeOptions(selectedId)}</select></label><label>To<select id="eTo">${edgeOptions(defaultTo)}</select></label><div class="row2"><label>Relationship type<input id="eRelType" placeholder="depends on, influences, contains…"></label><label>Label<input id="eType" placeholder="short relationship description"></label></div><label>Notes<textarea id="eNotes"></textarea></label><div class="row2"><label>Weight / thickness<input id="eWeight" type="number" step="0.25" min="0.5" max="5" value="1"></label><label>Preferred length<input id="eLength" type="number" min="40" max="400" value="100"></label></div><div class="row2"><label>Edge color<input id="eColor" placeholder="#8fb5ff (optional)"></label><label><input id="eDashed" type="checkbox" style="width:auto;margin-right:6px">Dashed</label></div><label>Custom metadata (JSON object)<textarea id="eMeta" spellcheck="false">{}</textarea></label><button onclick="saveEdge()">Save relationship</button><button onclick="renderPanel()">Cancel</button></div>`);if(innerWidth<761)openModal()}
function showEditEdge(idx){const e=data.edges[idx];if(!e)return;selectedEdgeIdx=idx;setPanels(`<div class="form"><div class="nodeTitle">Edit relationship</div><label>From<select id="eFrom">${edgeOptions(e.source)}</select></label><label>To<select id="eTo">${edgeOptions(e.target)}</select></label><div class="row2"><label>Relationship type<input id="eRelType" value="${attr(e.relationshipType||'')}"></label><label>Label<input id="eType" value="${attr(e.type||'')}"></label></div><label>Notes<textarea id="eNotes">${esc(e.notes||'')}</textarea></label><div class="row2"><label>Weight / thickness<input id="eWeight" type="number" step="0.25" min="0.5" max="5" value="${attr(e.weight||1)}"></label><label>Preferred length<input id="eLength" type="number" min="40" max="400" value="${attr(e.length||100)}"></label></div><div class="row2"><label>Edge color<input id="eColor" value="${attr(e.color||'')}"></label><label><input id="eDashed" type="checkbox" ${e.dashed?'checked':''} style="width:auto;margin-right:6px">Dashed</label></div><label>Custom metadata (JSON object)<textarea id="eMeta" spellcheck="false">${esc(JSON.stringify(e.meta||{},null,2))}</textarea></label><button onclick="saveEditedEdge(${idx})">Save changes</button><button class="danger" onclick="deleteEdge(${idx})">Delete relationship</button><button onclick="selectedEdgeIdx=null;renderPanel()">Cancel</button></div>`)}
function readEdgeForm(){const source=val('eFrom'),target=val('eTo');if(source===target)throw new Error('Choose two different nodes.');const panel=(getComputedStyle(document.getElementById('panel')).display!=='none'?document.getElementById('panel'):document.getElementById('mobilePanel'));return{source,target,relationshipType:val('eRelType').trim(),type:val('eType').trim()||'related to',notes:val('eNotes').trim(),weight:Math.max(.5,Math.min(5,Number(val('eWeight'))||1)),length:Math.max(40,Math.min(400,Number(val('eLength'))||100)),color:val('eColor').trim(),dashed:!!panel.querySelector('#eDashed')?.checked,meta:parseJSON(val('eMeta'),'Relationship metadata')}}
function saveEdge(){try{data.edges.push(readEdgeForm());selectedEdgeIdx=data.edges.length-1;saveData();rebuild()}catch(e){alert(e.message)}}
function saveEditedEdge(idx){try{if(!data.edges[idx])return;data.edges[idx]=readEdgeForm();selectedId=data.edges[idx].source;selectedEdgeIdx=idx;saveData();rebuild()}catch(e){alert(e.message)}}
function deleteEdge(idx){if(!data.edges[idx])return;if(!confirm('Delete this relationship?'))return;data.edges.splice(idx,1);selectedEdgeIdx=null;saveData();rebuild()}
function deleteNode(id){const n=data.nodes.find(x=>x.id===id);if(!n)return;const connected=data.edges.filter(e=>e.source===id||e.target===id);if(!confirm(`Delete “${n.name}”?\n\nThis will also delete ${connected.length} connected relationship${connected.length===1?'':'s'}.`))return;data.edges=data.edges.filter(e=>e.source!==id&&e.target!==id);data.nodes=data.nodes.filter(x=>x.id!==id);selectedId=data.nodes[0]?.id||null;selectedEdgeIdx=null;saveData();rebuild()}
function clearGraph(){if(!confirm('Clear every node and relationship from this graph? Export first if you may want it later.'))return;data=clone(SEED);selectedId=null;selectedEdgeIdx=null;saveData();rebuild();resetView()}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='flexible-graph-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(ev){const f=ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!Array.isArray(x.nodes)||!Array.isArray(x.edges))throw Error();data=x;selectedId=data.nodes[0]?.id||null;selectedEdgeIdx=null;saveData();rebuild();alert('Imported.')}catch(e){alert('That file must contain top-level nodes[] and edges[] arrays.')}};rd.readAsText(f)}
function resetView(){scale=1;offsetX=0;offsetY=0;if(data.nodes.length){for(const d of data.nodes){if(!d.pinned){d.x=w/2+(Math.random()-.5)*260;d.y=h/2+(Math.random()-.5)*260}}saveData('View reset and positions saved.')}rebuild()}
function setPanels(html){document.getElementById('panel').innerHTML=html;document.getElementById('mobilePanel').innerHTML=html}
function openModal(){document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('drawerBtn').onclick=openModal;document.getElementById('closeModal').onclick=closeModal;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.getElementById('resetBtn').onclick=resetView;document.getElementById('addTopBtn').onclick=showAddNode;document.getElementById('search').addEventListener('input',e=>{searchText=e.target.value.trim().toLowerCase();const found=nodes.find(visible);if(searchText&&found){selectedId=found.id;renderPanel()}});document.getElementById('typeFilter').addEventListener('change',e=>{filterType=e.target.value});
function short(s,n){return String(s).length>n?String(s).slice(0,n-1)+'…':String(s)}
window.addEventListener('resize',resize);resize();rebuild();tick();
</script>
</body>
</html>
