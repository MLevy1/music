#drawerBtn{display:none}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{background:var(--panel);border-radius:18px 18px 0 0;width:100%;max-height:82dvh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}.sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sheetHead h2{margin:0;font-size:18px}

.canvasWrap canvas{position:absolute;inset:0;z-index:2}.fallbackGraph{position:absolute;inset:0;width:100%;height:100%;z-index:1;background:var(--bg)}
.fbedges line{stroke:#4c5567;stroke-width:1.2;opacity:.55}.fbnode circle{fill:#98a2b3;stroke:#0f1115;stroke-width:2}.fbnode text{fill:#d9dee7;font-size:11px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.fbnode.root circle{fill:#d7b56d}.fbnode.layer circle{fill:#91b5e8}.fbnode.artist circle{fill:#9bc7a7}.fbnode.style circle{fill:#c7a2cf}.fbnode.other circle{fill:#aaa}
.noScriptNote{position:absolute;left:12px;top:12px;z-index:3;background:#171a21e8;border:1px solid var(--border);border-radius:10px;padding:8px 10px;color:var(--muted);font-size:12px;max-width:310px}

function draw(){ctx.clearRect(0,0,w,h);if(w>20&&h>20){const fb=document.getElementById('fallbackGraph'),pn=document.getElementById('previewNote');if(fb)fb.style.display='none';if(pn)pn.style.display='none';}const vis=nodes.filter(visible),vset=new Set(vis.map(n=>n.id)),focus=selectedId?neighborSet(selectedId):null;
  ctx.lineWidth=1; for(let i=0;i<edges.length;i++){const e=edges[i];if(!vset.has(e.source)||!vset.has(e.target))continue;const a=worldToScreen(e.a),b=worldToScreen(e.b),chosen=e.dataIndex===selectedEdgeIdx,hot=chosen||(focus&&focus.has(e.source)&&focus.has(e.target));ctx.strokeStyle=chosen?'rgba(255,217,143,.95)':hot?'rgba(190,211,255,.72)':'rgba(120,130,150,.22)';ctx.lineWidth=chosen?4:hot?1.8:1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
  for(const n of vis){const p=worldToScreen(n),hot=selectedId===n.id,near=focus&&focus.has(n.id),dim=focus&&!near;ctx.globalAlpha=dim?.22:1;ctx.fillStyle=colorFor(n.type);ctx.beginPath();ctx.arc(p.x,p.y,n.r*(hot?1.18:1),0,Math.PI*2);ctx.fill();if(hot){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()} if(scale>.62||hot||n===nodes.find(x=>x.id===hoveredId)){ctx.fillStyle='#eef1f5';ctx.font=(hot?'600 ':'')+'12px -apple-system,BlinkMacSystemFont,sans-serif';ctx.textAlign='center';ctx.fillText(short(n.name,29),p.x,p.y+n.r+15)}ctx.globalAlpha=1}
}
function tick(){simulate();draw();requestAnimationFrame(tick)}
function hit(x,y){let best=null,bd=Infinity;for(const n of nodes.filter(visible)){const p=worldToScreen(n),d=Math.hypot(p.x-x,p.y-y);if(d<n.r+10&&d<bd){best=n;bd=d}}return best}
function hitEdge(x,y){const vis=new Set(nodes.filter(visible).map(n=>n.id));let best=null,bd=Infinity;for(const e of edges){if(!vis.has(e.source)||!vis.has(e.target))continue;const a=worldToScreen(e.a),b=worldToScreen(e.b),dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy;if(!l2)continue;let t=((x-a.x)*dx+(y-a.y)*dy)/l2;t=Math.max(0,Math.min(1,t));const px=a.x+t*dx,py=a.y+t*dy,d=Math.hypot(x-px,y-py);if(d<10&&d<bd){best=e;bd=d}}return best}
function pointerPos(ev){const r=canvas.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const p=pointerPos(e),n=hit(p.x,p.y);moved=false;lastX=p.x;lastY=p.y;if(n){dragNode=n;const q=screenToWorld(p.x,p.y);n.x=q.x;n.y=q.y}else panning=true});
canvas.addEventListener('pointermove',e=>{const p=pointerPos(e);hoveredId=hit(p.x,p.y)?.id||null;if(Math.hypot(p.x-lastX,p.y-lastY)>3)moved=true;if(dragNode){const q=screenToWorld(p.x,p.y);dragNode.x=q.x;dragNode.y=q.y;dragNode.vx=dragNode.vy=0}else if(panning){offsetX+=p.x-lastX;offsetY+=p.y-lastY}lastX=p.x;lastY=p.y});
canvas.addEventListener('pointerup',e=>{const p=pointerPos(e);if(!moved){const n=hit(p.x,p.y);if(n){selectedId=n.id;selectedEdgeIdx=null;renderPanel();if(innerWidth<761)openModal()}else{const edge=hitEdge(p.x,p.y);if(edge){selectedEdgeIdx=edge.dataIndex;showEditEdge(edge.dataIndex);if(innerWidth<761)openModal()}}}dragNode=null;panning=false});
canvas.addEventListener('wheel',e=>{e.preventDefault();const p=pointerPos(e),before=screenToWorld(p.x,p.y),factor=Math.exp(-e.deltaY*.001);scale=Math.max(.25,Math.min(3.5,scale*factor));offsetX=p.x-before.x*scale;offsetY=p.y-before.y*scale},{passive:false});
let touches=new Map(), pinchDist=0;
canvas.addEventListener('pointerdown',e=>{touches.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(touches.size===2){const a=[...touches.values()];pinchDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});
canvas.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2){const a=[...touches.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinchDist){scale=Math.max(.25,Math.min(3.5,scale*(d/pinchDist)))}pinchDist=d}});
canvas.addEventListener('pointerup',e=>touches.delete(e.pointerId));canvas.addEventListener('pointercancel',e=>touches.delete(e.pointerId));
function renderPanel(){const n=data.nodes.find(x=>x.id===selectedId)||data.nodes[0];if(!n)return;const related=data.edges.map((e,idx)=>({e,idx})).filter(x=>x.e.source===n.id||x.e.target===n.id).map(x=>{const e=x.e,out=e.source===n.id,other=data.nodes.find(y=>y.id===(out?e.target:e.source));return {idx:x.idx,dir:out?'→':'←',type:e.type,notes:e.notes||'',other}}).filter(x=>x.other);
 const html=`<div class="nodeTitle">${esc(n.name)}</div><div><span class="pill">${esc(n.type)}</span><span class="pill">${related.length} connection${related.length===1?'':'s'}</span></div><p class="muted">${esc(n.notes||'No notes yet.')}</p><div class="section"><h3>Connections</h3>${related.length?related.map(r=>`<div class="edge ${selectedEdgeIdx===r.idx?'edgeSelected':''}"><div class="edgeMain"><div class="edgeJump" data-jump="${esc(r.other.id)}"><b>${r.dir} ${esc(r.other.name)}</b><small>${esc(r.type)}${r.notes?' · '+esc(r.notes):''}</small></div><div class="edgeActions"><button onclick="showEditEdge(${r.idx});event.stopPropagation()">Edit</button><button class="danger" onclick="deleteEdge(${r.idx});event.stopPropagation()">Delete</button></div></div></div>`).join(''):'<div class="muted">No connections.</div>'}</div><div class="toolbar"><button onclick="showEditNode()">Edit node</button><button onclick="showAddNode()">Add node</button><button onclick="showAddEdge()">Add edge</button><button onclick="exportData()">Export JSON</button><button onclick="document.getElementById('importFile').click()">Import JSON</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"><button class="danger" onclick="resetSeed()">Restore seed</button></div><div class="status">Changes are stored in this browser using local storage.</div>`;
 document.getElementById('panel').innerHTML=html;document.getElementById('mobilePanel').innerHTML=html;document.querySelectorAll('[data-jump]').forEach(el=>el.onclick=()=>{selectedId=el.dataset.jump;selectedEdgeIdx=null;renderPanel()})}
function editForm(mode){const n=mode==='edit'?data.nodes.find(x=>x.id===selectedId):{id:'',name:'',type:'artist',notes:''};return `<div class="form"><label>Name<input id="fName" value="${attr(n.name)}"></label><label>Type<input id="fType" value="${attr(n.type)}"></label><label>Notes<textarea id="fNotes">${esc(n.notes||'')}</textarea></label><button onclick="saveNode('${mode}')">Save</button><button onclick="renderPanel()">Cancel</button></div>`}
function showEditNode(){setPanels(editForm('edit'))} function showAddNode(){setPanels(editForm('add'))}
function edgeOptions(selected){return data.nodes.map(n=>`<option value="${attr(n.id)}" ${n.id===selected?'selected':''}>${esc(n.name)}</option>`).join('')}
function showAddEdge(){selectedEdgeIdx=null;setPanels(`<div class="form"><div class="nodeTitle">Add relationship</div><label>From<select id="eFrom">${edgeOptions(selectedId)}</select></label><label>Relationship<input id="eType" placeholder="e.g. develops into"></label><label>To<select id="eTo">${edgeOptions('')}</select></label><label>Notes<textarea id="eNotes"></textarea></label><button onclick="saveEdge()">Save edge</button><button onclick="renderPanel()">Cancel</button></div>`)}
function showEditEdge(idx){const e=data.edges[idx];if(!e)return;selectedEdgeIdx=idx;const a=data.nodes.find(n=>n.id===e.source),b=data.nodes.find(n=>n.id===e.target);setPanels(`<div class="form"><div class="nodeTitle">Edit relationship</div><div class="muted">${esc(a?.name||e.source)} → ${esc(b?.name||e.target)}</div><label>From<select id="eFrom">${edgeOptions(e.source)}</select></label><label>Relationship<input id="eType" value="${attr(e.type||'')}"></label><label>To<select id="eTo">${edgeOptions(e.target)}</select></label><label>Notes<textarea id="eNotes">${esc(e.notes||'')}</textarea></label><button onclick="saveEditedEdge(${idx})">Save changes</button><button class="danger" onclick="deleteEdge(${idx})">Delete relationship</button><button onclick="selectedEdgeIdx=null;renderPanel()">Cancel</button></div>`)}
function setPanels(html){document.getElementById('panel').innerHTML=html;document.getElementById('mobilePanel').innerHTML=html}
function slug(s){let base=s.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||'node',id=base,i=2;while(data.nodes.some(n=>n.id===id))id=base+'_'+i++;return id}
function saveNode(mode){const name=val('fName').trim(),type=val('fType').trim()||'unknown',notes=val('fNotes').trim();if(!name)return alert('Name is required.');if(mode==='edit'){const n=data.nodes.find(x=>x.id===selectedId);Object.assign(n,{name,type,notes})}else{const id=slug(name);data.nodes.push({id,name,type,notes});selectedId=id}saveData();rebuild()}
function saveEdge(){const source=val('eFrom'),target=val('eTo'),type=val('eType').trim()||'related to',notes=val('eNotes').trim();if(source===target)return alert('Choose two different nodes.');data.edges.push({source,target,type,notes});selectedEdgeIdx=data.edges.length-1;saveData();rebuild()}
function saveEditedEdge(idx){const source=val('eFrom'),target=val('eTo'),type=val('eType').trim()||'related to',notes=val('eNotes').trim();if(source===target)return alert('Choose two different nodes.');if(!data.edges[idx])return;data.edges[idx]={source,target,type,notes};selectedId=source;selectedEdgeIdx=idx;saveData();rebuild()}
function deleteEdge(idx){const e=data.edges[idx];if(!e)return;if(!confirm('Delete this relationship?'))return;const keepNode=selectedId;data.edges.splice(idx,1);selectedEdgeIdx=null;selectedId=keepNode;saveData();rebuild()}

function val(id){return document.querySelector('#panel #'+id)?.value ?? document.querySelector('#mobilePanel #'+id)?.value ?? ''}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='music-graph-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(ev){const f=ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!Array.isArray(x.nodes)||!Array.isArray(x.edges))throw Error();data=x;selectedId=data.nodes[0]?.id||null;selectedEdgeIdx=null;saveData();rebuild();alert('Imported.')}catch(e){alert('That file does not look like Music Graph JSON.')}};rd.readAsText(f)}
function resetSeed(){if(confirm('Replace local changes with the original Music_2 seed graph?')){data=clone(SEED);selectedId='system';selectedEdgeIdx=null;saveData();rebuild();resetView()}}
function resetView(){scale=1;offsetX=0;offsetY=0;for(const n of nodes){n.x=w/2+(Math.random()-.5)*250;n.y=h/2+(Math.random()-.5)*250;n.vx=n.vy=0}}
function openModal(){document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('drawerBtn').onclick=openModal;document.getElementById('closeModal').onclick=closeModal;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.getElementById('resetBtn').onclick=resetView;
document.getElementById('search').addEventListener('input',e=>{searchText=e.target.value.trim().toLowerCase();const exact=nodes.find(n=>n.name.toLowerCase().includes(searchText)&&visible(n));if(searchText&&exact){selectedId=exact.id;renderPanel()}});document.getElementById('typeFilter').addEventListener('change',e=>{filterType=e.target.value});
function short(s,n){return s.length>n?s.slice(0,n-1)+'…':s}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function attr(s){return esc(s).replace(/`/g,'&#96;')}
window.addEventListener('resize',resize);resize();rebuild();resetView();tick();
</script>
</body>
</html>
