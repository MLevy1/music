<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A decimal-scale 3D spatial planner with custom colors and portable JSON saves."
    />
    <meta name="theme-color" content="#111318" />
    <title>Block/32 — Spatial Planner</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Block 32">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>BLOCK<span class="brand-slash">/</span>32</span>
        </div>
        <div class="world-meta" aria-live="polite">
          <span id="cube-count">0 cubes</span>
          <span class="meta-divider" aria-hidden="true"></span>
          <span id="save-state">Saved locally</span>
        </div>
        <div class="file-actions">
          <button class="button button-secondary" id="load-button" type="button">Load JSON</button>
          <button class="button button-primary" id="save-button" type="button">Save JSON</button>
          <input id="file-input" type="file" accept="application/json,.json" hidden />
        </div>
      </header>

      <section class="workspace" aria-label="3D cube building workspace">
        <div class="viewport-wrap">
          <canvas id="viewport" aria-label="Interactive 3D cube grid"></canvas>
          <div class="viewport-hint" id="viewport-hint">
            Click the grid to place a block · Drag to orbit · Scroll to zoom
          </div>
          <div class="loading-note" id="loading-note">Starting 3D workspace…</div>
          <div class="view-controls" aria-label="View controls">
            <button class="icon-button" id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
            <button class="icon-button" id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button>
            <button class="icon-button reset-view" id="reset-view" type="button" aria-label="Reset view" title="Reset view">⌂</button>
          </div>
        </div>

        <aside class="tool-panel" aria-label="Build tools">
          <div class="panel-section tool-section">
            <div class="section-label">Tool</div>
            <div class="segmented" role="group" aria-label="Editing tool">
              <button class="segment active" id="place-tool" type="button" aria-pressed="true">
                <span class="tool-icon add-icon" aria-hidden="true"></span>
                Place
              </button>
              <button class="segment" id="erase-tool" type="button" aria-pressed="false">
                <span class="tool-icon erase-icon" aria-hidden="true"></span>
                Erase
              </button>
            </div>
          </div>

          <div class="panel-section palette-section">
            <div class="section-heading">
              <span class="section-label">Color</span>
              <span class="selected-color-name" id="selected-color-name">Signal red</span>
            </div>
            <div class="palette" id="palette" role="listbox" aria-label="Block color"></div>
          </div>

          <div class="panel-section world-section">
            <div class="section-label">World</div>
            <button class="text-button danger" id="clear-button" type="button">Clear all cubes</button>
            <p class="storage-note">Every change is saved on this device. JSON files are portable.</p>
          </div>
        </aside>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./planner.js"></script>
  </body>
</html>
